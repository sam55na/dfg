<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>IChancy - Epic Fire Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050302;
            overflow-x: hidden;
            padding: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
        }

        /* ============ خلفية نارية ============ */
        .bg-image-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
            filter: brightness(0.3) saturate(1.5) contrast(1.25);
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .fire-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255, 80, 0, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 160, 0, 0.28) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 90%, rgba(200, 40, 0, 0.22) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(200, 40, 0, 0.22) 0%, transparent 50%);
            animation: firePulse 3s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }
        @keyframes firePulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        .embers-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ember {
            position: absolute;
            bottom: -20px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b0, #ff8c00 40%, #ff2200 80%, transparent);
            box-shadow: 0 0 12px #ff6600, 0 0 24px #ff2200;
            animation: emberRise linear infinite;
        }
        @keyframes emberRise {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(var(--drift, 40px)) scale(0.2); opacity: 0; }
        }

        .user-status { display: none; }

        /* ============================================================
           العجلة - السيوف خلفها
           ============================================================ */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            aspect-ratio: 1/1;
            display: none;
            z-index: 1;
            padding: 20px;
        }
        .wheel-wrapper.show {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        /* حاوية السيوف خلف العجلة */
        .swords-behind {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== السيف الواقعي ===== */
        .sword {
            position: absolute;
            width: 26px;
            height: 130%;
            top: 50%; left: 50%;
            transform-origin: center center;
            filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 40, 0, 0.5));
        }
        .sword-left {
            transform: translate(-50%, -50%) rotate(-42deg) translateY(-12%);
        }
        .sword-right {
            transform: translate(-50%, -50%) rotate(42deg) translateY(-12%);
        }

        /* المقبض (أسفل السيف) */
        .sword-grip {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 22%;
            background:
                repeating-linear-gradient(45deg,
                    #3d1f0a 0px, #3d1f0a 3px,
                    #5a2e12 3px, #5a2e12 6px,
                    #2a1405 6px, #2a1405 9px);
            border-radius: 3px;
            box-shadow:
                inset -2px 0 3px rgba(0,0,0,0.7),
                inset 2px 0 3px rgba(120,80,40,0.3),
                0 0 6px rgba(0,0,0,0.8);
            border: 1px solid #1a0d03;
        }
        /* رأس المقبض (Pommel) */
        .sword-pommel {
            position: absolute;
            bottom: -12px; left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffdd55 0%, #cc9900 30%, #8b6508 70%, #4a3200 100%);
            box-shadow:
                0 0 12px rgba(255, 200, 50, 0.9),
                0 0 24px rgba(255, 100, 0, 0.6),
                inset 0 2px 3px rgba(255, 255, 200, 0.5),
                inset 0 -3px 4px rgba(0,0,0,0.7);
        }
        /* الحاجز (Guard) */
        .sword-guard {
            position: absolute;
            bottom: 21%; left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: linear-gradient(180deg,
                #ffdd55 0%,
                #cc9900 25%,
                #8b6508 50%,
                #5a4400 75%,
                #3a2c00 100%);
            border-radius: 4px;
            box-shadow:
                0 0 12px rgba(255, 200, 50, 0.9),
                0 0 24px rgba(255, 100, 0, 0.5),
                inset 0 2px 2px rgba(255, 255, 200, 0.6),
                inset 0 -2px 3px rgba(0,0,0,0.7);
        }
        .sword-guard::before,
        .sword-guard::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffdd55, #8b6508);
            transform: translateY(-50%);
            box-shadow: 0 0 8px rgba(255, 180, 50, 0.9);
        }
        .sword-guard::before { left: -6px; }
        .sword-guard::after { right: -6px; }

        /* النصل (Blade) - أطول جزء */
        .sword-blade {
            position: absolute;
            bottom: 22%; left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 78%;
            background: linear-gradient(90deg,
                #1a1a1a 0%,
                #3a3a3a 12%,
                #7a7a7a 28%,
                #c8c8c8 42%,
                #f0f0f0 50%,
                #c8c8c8 58%,
                #7a7a7a 72%,
                #3a3a3a 88%,
                #1a1a1a 100%);
            clip-path: polygon(50% 0%, 88% 3%, 100% 12%, 100% 100%, 0% 100%, 0% 12%, 12% 3%);
            box-shadow:
                inset 0 0 6px rgba(0,0,0,0.6),
                0 0 10px rgba(255, 120, 0, 0.4);
        }
        /* حافة النصل المشتعلة */
        .sword-blade::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg,
                #ffffff 0%,
                #ffdd88 15%,
                #ff8800 35%,
                #ff4400 55%,
                #aa1100 75%,
                transparent 95%);
            filter: blur(1.5px);
            box-shadow:
                0 0 12px #ff6600,
                0 0 24px #ff3300,
                0 0 40px #ff1100;
            animation: bladeFirePulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes bladeFirePulse {
            0% { opacity: 0.75; filter: blur(1.5px) brightness(1); }
            100% { opacity: 1; filter: blur(2px) brightness(1.4); }
        }
        /* دمشق (خطوط النصل) */
        .sword-blade::after {
            content: '';
            position: absolute;
            top: 8%; left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 84%;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.4) 0%,
                rgba(200,200,200,0.6) 50%,
                rgba(150,150,150,0.4) 100%);
            filter: blur(0.5px);
        }

        /* حاوية اللهب حول الإطار */
        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           لهب الإطار الواقعي - ألسنة اللهب
           ============================================================ */
        .fire-flames {
            position: absolute;
            top: -32px; left: -32px;
            width: calc(100% + 64px);
            height: calc(100% + 64px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        /* كل شعلة لهب */
        .flame {
            position: absolute;
            top: 50%; left: 50%;
            width: 30px;
            height: 60px;
            margin-left: -15px;
            margin-top: -30px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(ellipse at 50% 90%,
                #fff8b0 0%,
                #ffdd00 15%,
                #ff8800 35%,
                #ff4400 55%,
                #aa1100 75%,
                transparent 90%);
            transform-origin: center bottom;
            filter: blur(2px);
            animation: flameDance 1.4s ease-in-out infinite alternate;
            opacity: 0.9;
            box-shadow:
                0 0 20px rgba(255, 100, 0, 0.9),
                0 0 40px rgba(255, 40, 0, 0.6);
        }
        /* شعلة داخلية (أفتح) */
        .flame::before {
            content: '';
            position: absolute;
            bottom: 5%; left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 55%;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(ellipse at 50% 90%,
                #ffffff 0%,
                #fff8b0 20%,
                #ffdd00 50%,
                transparent 80%);
            filter: blur(1px);
            animation: flameInnerDance 0.9s ease-in-out infinite alternate;
        }

        @keyframes flameDance {
            0% {
                transform: scaleY(1) scaleX(1) rotate(-3deg);
                filter: blur(2px) brightness(1);
            }
            50% {
                transform: scaleY(1.25) scaleX(0.9) rotate(2deg);
                filter: blur(2.5px) brightness(1.2);
            }
            100% {
                transform: scaleY(1.1) scaleX(1.05) rotate(-1deg);
                filter: blur(2px) brightness(1.1);
            }
        }
        @keyframes flameInnerDance {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.85; }
            100% { transform: translateX(-50%) scaleY(1.3) scaleX(0.8); opacity: 1; }
        }

        /* إطار مشتعل أساسي (تحت اللهب) */
        .fire-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            border: 6px solid transparent;
            background:
                linear-gradient(#050302, #050302) padding-box,
                conic-gradient(from 0deg,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200) border-box;
            box-shadow:
                0 0 25px rgba(255, 80, 0, 0.8),
                0 0 50px rgba(255, 40, 0, 0.6),
                0 0 90px rgba(255, 20, 0, 0.4),
                inset 0 0 30px rgba(255, 100, 0, 0.5);
            animation: fireRingRotate 6s linear infinite;
        }
        @keyframes fireRingRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* هالة خارجية */
        .fire-halo {
            position: absolute;
            top: -40px; left: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle,
                rgba(255, 120, 0, 0.35) 0%,
                rgba(255, 50, 0, 0.18) 40%,
                transparent 70%);
            filter: blur(20px);
            animation: haloPulse 2.5s ease-in-out infinite alternate;
        }
        @keyframes haloPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* شرر متصاعد من الإطار */
        .sparks-layer {
            position: absolute;
            top: -30px; left: -30px;
            width: calc(100% + 60px);
            height: calc(100% + 60px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            overflow: visible;
        }
        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b0, #ff8800 40%, #ff2200 80%, transparent);
            box-shadow: 0 0 8px #ff6600, 0 0 16px #ff2200;
            animation: sparkFloat 2.5s ease-out infinite;
        }
        @keyframes sparkFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px) translateX(var(--sx, 0)) scale(0);
                opacity: 0;
            }
        }

        /* ============================================================
           الرمح (بدل السهم)
           ============================================================ */
        .pointer {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 40px;
            height: 90px;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 40, 0, 0.6));
            animation: spearBounce 1.6s ease-in-out infinite;
        }
        @keyframes spearBounce {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-6px) rotate(-3deg); }
        }

        /* رأس الرمح (مثلث معدني) */
        .spear-tip {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 34px;
            background: linear-gradient(90deg,
                #1a1a1a 0%,
                #4a4a4a 20%,
                #b0b0b0 45%,
                #f0f0f0 50%,
                #b0b0b0 55%,
                #4a4a4a 80%,
                #1a1a1a 100%);
            clip-path: polygon(50% 0%, 100% 70%, 100% 100%, 0% 100%, 0% 70%);
            box-shadow:
                inset 0 0 6px rgba(0,0,0,0.5),
                0 0 10px rgba(255, 120, 0, 0.6);
        }
        .spear-tip::before {
            content: '';
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 80%;
            background: linear-gradient(180deg, #fff, #ffaa00, #ff4400);
            filter: blur(0.8px);
            box-shadow: 0 0 8px #ff6600, 0 0 16px #ff2200;
        }
        /* قاعدة الرمح */
        .spear-collar {
            position: absolute;
            top: 32px; left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 8px;
            background: linear-gradient(180deg, #ffdd55, #8b6508, #3a2c00);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 180, 50, 0.9);
        }
        /* عمود الرمح */
        .spear-shaft {
            position: absolute;
            top: 38px; left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 42px;
            background: linear-gradient(90deg,
                #2a1a0a 0%,
                #5a3a1a 25%,
                #8a5a2a 50%,
                #5a3a1a 75%,
                #2a1a0a 100%);
            border-radius: 1px;
            box-shadow:
                inset -1px 0 2px rgba(0,0,0,0.7),
                inset 1px 0 2px rgba(120,80,40,0.4);
        }
        /* ريش الرمح */
        .spear-feather {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 14px;
            background: linear-gradient(180deg, #8b0000 0%, #cc2200 50%, #ff4400 100%);
            clip-path: polygon(0% 100%, 15% 0%, 85% 0%, 100% 100%, 85% 60%, 15% 60%);
            filter: drop-shadow(0 0 6px rgba(255, 60, 0, 0.8));
        }
        .spear-feather::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                transparent 0px, transparent 3px,
                rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px);
        }

        /* ============================================================
           الشرر المتوهج حول العجلة
           ============================================================ */
        .glow-bubbles-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
            border-radius: 50%;
        }
        .glow-bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 200, 100, 0.9), rgba(255, 80, 0, 0.4) 50%, transparent 80%);
            box-shadow: 0 0 15px rgba(255, 120, 0, 0.8), 0 0 30px rgba(255, 40, 0, 0.5);
            pointer-events: none;
            animation: floatFire 8s infinite alternate ease-in-out;
            opacity: 0.85;
        }
        @keyframes floatFire {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(15px, -25px) scale(1.2); }
            50% { transform: translate(-10px, 20px) scale(0.8); }
            75% { transform: translate(20px, 15px) scale(1.1); }
            100% { transform: translate(-15px, -20px) scale(0.9); }
        }
        .glow-bubble:nth-child(1) { width: 10px; height: 10px; top: 10%; left: 12%; animation-duration: 6s; }
        .glow-bubble:nth-child(2) { width: 14px; height: 14px; top: 6%; right: 18%; animation-duration: 7s; animation-delay: 1s; }
        .glow-bubble:nth-child(3) { width: 8px; height: 8px; bottom: 18%; left: 8%; animation-duration: 5s; animation-delay: 2s; }
        .glow-bubble:nth-child(4) { width: 12px; height: 12px; bottom: 12%; right: 10%; animation-duration: 6.5s; animation-delay: 0.5s; }
        .glow-bubble:nth-child(5) { width: 9px; height: 9px; top: 48%; left: 3%; animation-duration: 7.5s; animation-delay: 3s; }
        .glow-bubble:nth-child(6) { width: 11px; height: 11px; top: 44%; right: 4%; animation-duration: 6s; animation-delay: 1.5s; }
        .glow-bubble:nth-child(7) { width: 7px; height: 7px; top: 72%; left: 22%; animation-duration: 5.5s; animation-delay: 0.3s; }
        .glow-bubble:nth-child(8) { width: 13px; height: 13px; top: 68%; right: 20%; animation-duration: 7s; animation-delay: 2.5s; }

        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.85),
                inset 0 0 40px rgba(255, 60, 0, 0.3),
                0 0 30px rgba(255, 80, 0, 0.4);
            border: none;
            transition: filter 0.4s ease;
            display: block;
            position: relative;
            z-index: 3;
            background: #050302;
        }
        .wheel-wrapper canvas.spinning {
            filter: brightness(1.2) contrast(1.1)
                    drop-shadow(0 0 40px rgba(255, 80, 0, 0.6));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: #ff8866;
            font-size: 15px;
            background: rgba(20, 5, 0, 0.9);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 80, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.2);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            letter-spacing: 0.5px;
        }
        .btn-spin {
            background: linear-gradient(135deg,
                #8b0000 0%,
                #ff2200 25%,
                #ff6600 50%,
                #ffaa00 75%,
                #ff6600 100%);
            background-size: 200% 200%;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255, 200, 100, 0.6);
            box-shadow:
                0 0 20px rgba(255, 80, 0, 0.6),
                0 0 40px rgba(255, 40, 0, 0.3),
                inset 0 0 20px rgba(255, 200, 100, 0.2),
                inset 0 -3px 10px rgba(0, 0, 0, 0.5);
            font-size: 19px;
            animation: fireBtnPulse 2s ease-in-out infinite;
            border: 1px solid rgba(255, 180, 0, 0.5);
        }
        @keyframes fireBtnPulse {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 0 20px rgba(255, 80, 0, 0.6),
                            0 0 40px rgba(255, 40, 0, 0.3),
                            inset 0 0 20px rgba(255, 200, 100, 0.2);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 0 30px rgba(255, 120, 0, 0.9),
                            0 0 60px rgba(255, 40, 0, 0.5),
                            inset 0 0 25px rgba(255, 200, 100, 0.3);
            }
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.15);
        }
        .btn-spin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            animation: none;
            filter: grayscale(0.6);
        }
        .btn-spin .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

    <script>

        // ================================================================

        // ================================================================

        // ================================================================
        //                      نظام إعادة محاولة الاتصال
        // ================================================================
        class ConnectionManager {
            constructor() {
                this.maxRetries = 3;
                this.retryDelay = 2000;
                this.timeout = 50000;
            }
            async fetchWithRetry(url, options = {}, retryCount = 0) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), this.timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') throw new Error('انتهت مهلة الاتصال بالخادم (50 ثانية)');
                    if (retryCount < this.maxRetries) {
                        const delay = this.retryDelay * (retryCount + 1);
                        console.log(`محاولة إعادة الاتصال ${retryCount + 1}/${this.maxRetries} بعد ${delay}ms`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return this.fetchWithRetry(url, options, retryCount + 1);
                    }
                    throw error;
                }
            }
        }
        const connectionManager = new ConnectionManager();

        // ================================================================
        //   نظام الصوت الملحمي (نيران، انفجارات، حرق)
        // ================================================================
        class FireSoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
                this.spinNode = null;
                this.noiseBuffer = null;
            }
            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    // بناء مخزن noise للهب
                    const bufferSize = this.audioContext.sampleRate * 2;
                    const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    this.noiseBuffer = buffer;
                    this.initialized = true;
                } catch (e) { console.warn('Web Audio not supported'); }
            }
            stopAll() {
                if (this.spinNode) {
                    try { this.spinNode.stop(); } catch (e) {}
                    this.spinNode = null;
                }
            }
            // هدير اللهب أثناء التدوير
            playSpinSound() {
                if (!soundEnabled || !this.initialized) return;
                this.stopAll();
                try {
                    const ctx = this.audioContext;
                    const source = ctx.createBufferSource();
                    source.buffer = this.noiseBuffer;
                    source.loop = true;

                    // فلتر لتشكيل صوت الهب
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(400, ctx.currentTime + 3);

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.5);
                    gain.gain.linearRampToValueAtTime(0.03, ctx.currentTime + 3.5);

                    // LFO لتذبذب صوت اللهب
                    const lfo = ctx.createOscillator();
                    lfo.frequency.setValueAtTime(8, ctx.currentTime);
                    lfo.type = 'sine';
                    const lfoGain = ctx.createGain();
                    lfoGain.gain.setValueAtTime(200, ctx.currentTime);
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);

                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    source.start();
                    lfo.start();

                    this.spinNode = source;
                    setTimeout(() => {
                        try {
                            source.stop();
                            lfo.stop();
                        } catch (e) {}
                        this.spinNode = null;
                    }, 4500);

                    // صوت شرر خفيف كل 120ms
                    let count = 0;
                    this.spinInterval = setInterval(() => {
                        if (!soundEnabled) { clearInterval(this.spinInterval); return; }
                        try {
                            const t = ctx.currentTime;
                            const osc = ctx.createOscillator();
                            const g = ctx.createGain();
                            osc.connect(g);
                            g.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800 + Math.random() * 1200, t);
                            osc.type = 'triangle';
                            g.gain.setValueAtTime(0.02, t);
                            g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                            osc.start(t);
                            osc.stop(t + 0.06);
                            count++;
                            if (count > 35) clearInterval(this.spinInterval);
                        } catch (e) {}
                    }, 120);
                } catch (e) { console.warn('spin sound err', e); }
            }
            // صوت فوز ملحمي: طبل + صرخة + انفجار + رعد
            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;

                    // 1) انفجار اللهب (noise burst)
                    const burst = ctx.createBufferSource();
                    burst.buffer = this.noiseBuffer;
                    const bFilter = ctx.createBiquadFilter();
                    bFilter.type = 'lowpass';
                    bFilter.frequency.setValueAtTime(2000, now);
                    bFilter.frequency.exponentialRampToValueAtTime(200, now + 0.6);
                    const bGain = ctx.createGain();
                    bGain.gain.setValueAtTime(0.25, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                    burst.connect(bFilter);
                    bFilter.connect(bGain);
                    bGain.connect(ctx.destination);
                    burst.start(now);
                    burst.stop(now + 0.7);

                    // 2) نغمة انتصار صاعدة
                    const melody = [
                        [392, 0.18], [523, 0.18], [659, 0.18],
                        [784, 0.25], [1047, 0.35], [1319, 0.5]
                    ];
                    melody.forEach(([freq, dur], i) => {
                        const start = now + 0.15 + i * 0.16;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g);
                        g.connect(ctx.destination);
                        osc.type = i < 3 ? 'sawtooth' : 'square';
                        osc.frequency.setValueAtTime(freq, start);
                        g.gain.setValueAtTime(0.0, start);
                        g.gain.linearRampToValueAtTime(0.08, start + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
                        osc.start(start);
                        osc.stop(start + dur);
                    });

                    // 3) هدير ناري مستمر لفترة
                    const roar = ctx.createBufferSource();
                    roar.buffer = this.noiseBuffer;
                    const rFilter = ctx.createBiquadFilter();
                    rFilter.type = 'bandpass';
                    rFilter.frequency.setValueAtTime(300, now + 1);
                    rFilter.Q.setValueAtTime(0.8, now + 1);
                    const rGain = ctx.createGain();
                    rGain.gain.setValueAtTime(0.0, now + 1);
                    rGain.gain.linearRampToValueAtTime(0.08, now + 1.3);
                    rGain.gain.exponentialRampToValueAtTime(0.001, now + 3);
                    roar.connect(rFilter);
                    rFilter.connect(rGain);
                    rGain.connect(ctx.destination);
                    roar.start(now + 1);
                    roar.stop(now + 3);
                } catch (e) { console.warn('win sound err', e); }
            }
            // صوت خسارة: حرق + تلاشي
            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;

                    // صوت حرق (noise منخفض)
                    const burn = ctx.createBufferSource();
                    burn.buffer = this.noiseBuffer;
                    const bF = ctx.createBiquadFilter();
                    bF.type = 'lowpass';
                    bF.frequency.setValueAtTime(1000, now);
                    bF.frequency.exponentialRampToValueAtTime(120, now + 1.2);
                    const bG = ctx.createGain();
                    bG.gain.setValueAtTime(0.12, now);
                    bG.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
                    burn.connect(bF);
                    bF.connect(bG);
                    bG.connect(ctx.destination);
                    burn.start(now);
                    burn.stop(now + 1.3);

                    // نغمة هبوط حزينة
                    const notes = [[392, 0.3], [311, 0.35], [261, 0.4], [196, 0.6]];
                    notes.forEach(([freq, dur], i) => {
                        const start = now + i * 0.25;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g);
                        g.connect(ctx.destination);
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, start);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.7, start + dur);
                        g.gain.setValueAtTime(0.07, start);
                        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
                        osc.start(start);
                        osc.stop(start + dur);
                    });
                } catch (e) { console.warn('lose sound err', e); }
            }
            playStartSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    // صوت إشعال النار "fwoosh"
                    const noise = ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(400, now);
                    filter.frequency.exponentialRampToValueAtTime(3000, now + 0.5);
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                    noise.stop(now + 0.5);
                } catch (e) { console.warn('start sound err', e); }
            }
        }
        const soundManager = new FireSoundManager();

        // ================================================================
        //                      جلب USER_ID
        // ================================================================
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) {
                USER_ID = parseInt(id);
                localStorage.setItem('wheel_user_id', USER_ID);
                return USER_ID;
            }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        USER_ID = user.id;
                        localStorage.setItem('wheel_user_id', USER_ID);
                        return USER_ID;
                    }
                }
            } catch (e) {}
            id = localStorage.getItem('wheel_user_id');
            if (id) { USER_ID = parseInt(id); return USER_ID; }
            return null;
        }

        // ================================================================
        // ============================================================
        //  رسم العجلة مع أقسام الحمم البركانية
        // ============================================================
        function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const r = Math.min(w, h) / 2 - 12;
            const noPrizes = document.getElementById('noPrizes');
            const wrapper = document.getElementById('wheelWrapper');

            if (!prizes || prizes.length === 0) {
                noPrizes.style.display = 'block';
                wrapper.classList.remove('show');
                return;
            }
            noPrizes.style.display = 'none';
            wrapper.classList.add('show');
            ctx.clearRect(0, 0, w, h);

            const total = prizes.length;
            const step = (2 * Math.PI) / total;

            // خلفية دائرية سوداء
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            bgGrad.addColorStop(0, '#1a0805');
            bgGrad.addColorStop(1, '#050302');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            prizes.forEach((p, i) => {
                const start = i * step + rotation - Math.PI / 2;
                const end = start + step;
                const isHighlight = (i === highlightIndex);

                // ====== رسم قطاع الحمم البركانية ======
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                // تدرج الحمم البركانية (من المركز للخارج)
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                if (isHighlight) {
                    // عندما يكون مضاء (فائز)
                    grad.addColorStop(0, '#fff5b0');
                    grad.addColorStop(0.2, '#ffdd00');
                    grad.addColorStop(0.5, '#ff8800');
                    grad.addColorStop(0.8, '#ff4400');
                    grad.addColorStop(1, '#aa1100');
                } else {
                    // ألوان الحمم الداكنة مع لمسة من لون الجائزة المخصص
                    const c1 = p.color || '#3a0a00';
                    const c2 = p.color2 || '#1a0500';
                    grad.addColorStop(0, c1);
                    grad.addColorStop(0.3, c2);
                    grad.addColorStop(0.65, '#2a0800');
                    grad.addColorStop(1, '#0a0200');
                }
                ctx.fillStyle = grad;
                ctx.fill();

                // ====== خطوط الحمم (lava veins) داخل كل قطاع ======
                if (!isHighlight) {
                    ctx.save();
                    ctx.clip(); // يقص على القطاع
                    // 3-4 شقوق حمم عشوائية
                    const veinCount = 3 + (i % 3);
                    for (let v = 0; v < veinCount; v++) {
                        const angleOffset = start + step * (0.15 + v * 0.22);
                        const rStart = r * (0.2 + Math.random() * 0.15);
                        const rEnd = r * (0.85 + Math.random() * 0.1);
                        const x1 = cx + Math.cos(angleOffset) * rStart;
                        const y1 = cy + Math.sin(angleOffset) * rStart;
                        const x2 = cx + Math.cos(angleOffset + (Math.random() - 0.5) * 0.15) * rEnd;
                        const y2 = cy + Math.sin(angleOffset + (Math.random() - 0.5) * 0.15) * rEnd;

                        // توهج خلفي
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = 'rgba(255, 80, 0, 0.5)';
                        ctx.lineWidth = 4;
                        ctx.shadowColor = '#ff4400';
                        ctx.shadowBlur = 12;
                        ctx.stroke();

                        // خط الحمم الأساسي
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = '#ffcc00';
                        ctx.lineWidth = 1.5;
                        ctx.shadowColor = '#ffaa00';
                        ctx.shadowBlur = 6;
                        ctx.stroke();

                        // نقاط حمم متوهجة
                        ctx.beginPath();
                        ctx.arc(x1 + (x2 - x1) * 0.5, y1 + (y2 - y1) * 0.5, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffee88';
                        ctx.shadowColor = '#ffaa00';
                        ctx.shadowBlur = 8;
                        ctx.fill();
                    }
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }

                // حدود القطاع
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();
                ctx.strokeStyle = isHighlight
                    ? 'rgba(255, 220, 100, 1)'
                    : 'rgba(255, 100, 0, 0.55)';
                ctx.lineWidth = isHighlight ? 3 : 1.5;
                ctx.shadowColor = isHighlight ? '#ffdd00' : '#ff4400';
                ctx.shadowBlur = isHighlight ? 25 : 6;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // ====== الأيقونة (الحائز) ======
                const mid = start + step / 2;
                const tr = r * 0.68;
                const x = cx + Math.cos(mid) * tr;
                const y = cy + Math.sin(mid) * tr;

                ctx.save();
                ctx.translate(x, y);
                // جعل الأيقونة أفقية دائماً
                let rotationFix = 0;
                if (mid > Math.PI / 2 && mid < 3 * Math.PI / 2) {
                    rotationFix = Math.PI;
                }
                ctx.rotate(mid + rotationFix);

                // ظل توهج خلفي للأيقونة
                ctx.shadowColor = isHighlight ? '#ffdd00' : '#ff6600';
                ctx.shadowBlur = isHighlight ? 25 : 12;

                const iconSize = isHighlight ? 34 : 30;
                ctx.font = `bold ${iconSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = isHighlight ? '#ffffff' : '#ffe0a0';
                ctx.fillText(p.icon || '🎁', 0, 0);

                ctx.shadowBlur = 0;
                ctx.restore();

                // ====== القيمة/الوصف (نص صغير تحت الأيقونة) ======
                if (p.description) {
                    const textR = r * 0.88;
                    const tx = cx + Math.cos(mid) * textR;
                    const ty = cy + Math.sin(mid) * textR;

                    ctx.save();
                    ctx.translate(tx, ty);
                    let textRotationFix = 0;
                    if (mid > Math.PI / 2 && mid < 3 * Math.PI / 2) {
                        textRotationFix = Math.PI;
                    }
                    ctx.rotate(mid + textRotationFix);
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = isHighlight ? '#0a0505' : '#ffddaa';
                    ctx.shadowColor = isHighlight ? '#fff5b0' : '#000000';
                    ctx.shadowBlur = 6;
                    // اقتطاع النص الطويل
                    let txt = p.description;
                    if (txt.length > 14) txt = txt.substring(0, 14) + '…';
                    ctx.fillText(txt, 0, 0);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            });

            // ====== المركز (شمس مشتعلة) ======
            const centerR = r * 0.16;
            const centerIcon = settingsCache.center_icon || '🔥';

            const centerGrad = ctx.createRadialGradient(cx - 6, cy - 6, 0, cx, cy, centerR);
            centerGrad.addColorStop(0, '#fff8b0');
            centerGrad.addColorStop(0.25, '#ffdd00');
            centerGrad.addColorStop(0.6, '#ff6600');
            centerGrad.addColorStop(1, '#8b0000');

            ctx.beginPath();
            ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
            ctx.fillStyle = centerGrad;
            ctx.shadowColor = 'rgba(255, 140, 0, 0.9)';
            ctx.shadowBlur = 50;
            ctx.fill();
            ctx.shadowBlur = 0;

            // حلقة توهج خارجية
            ctx.beginPath();
            ctx.arc(cx, cy, centerR + 6, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // الأيقونة المركزية
            ctx.fillStyle = '#0a0505';
            ctx.font = '36px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 220, 100, 0.8)';
            ctx.shadowBlur = 15;
            ctx.fillText(centerIcon, cx, cy + 1);
            ctx.shadowBlur = 0;
        }

        // ================================================================
        //                      دوران العجلة
        // ================================================================
        function animateSpin(targetRotation, duration, callback) {
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');
            const startRotation = currentRotation;
            const startTime = performance.now();
            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startRotation + (targetRotation - startRotation) * easeOutCubic;
                currentRotation = currentAngle;
                drawWheel(prizesCache, -1, currentAngle);
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    canvas.classList.remove('spinning');
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animate);
        }

                            <div style="color:#666;font-size:13px;text-align:center;padding:20px;">
                                <div style="font-size:30px;margin-bottom:10px;">📭</div>

            }

            list.innerHTML = prizes.map((p, index) => `
                        <div class="prize-item" data-id="${p.id}" data-index="${index}">
                            <div class="prize-icon-small">${p.icon || '🎁'}</div>
                            <div class="prize-info">

                                </div>

                                </div>
                            </div>
                            <div class="prize-prob">
                                <input type="number" class="prob-input" value="${p.probability}" min="0" max="100" step="0.1">
                                <span class="prob-label">%</span>
                                <button class="btn-save-prob" data-id="${p.id}">💾</button>
                            </div>
                            <div class="prize-colors">
                                <input type="color" class="color-input" value="${p.color || '#1a1a2e'}" data-field="color" data-id="${p.id}">
                                <input type="color" class="color-input" value="${p.color2 || '#16213e'}" data-field="color2" data-id="${p.id}">
                            </div>
                            <button class="btn-delete" data-id="${p.id}">✕</button>
                        </div>
                    `).join('');

            list.querySelectorAll('.name-input').forEach(input => {
                input.addEventListener('change', async function() {
                    const item = this.closest('.prize-item');
                    const id = parseInt(item.dataset.id);

                    if (!value) {
                        showError('⚠️ الاسم مطلوب');
                        this.value = item.querySelector('.name-input').dataset.oldValue || '';
                        return;
                    }
                    const success = await updatePrize(id, { name: value });
                    if (success) { await refreshAll(); showNotification('✅ تم تحديث الاسم'); }
                    else { showError('❌ فشل تحديث الاسم'); await refreshAll(); }
                });
                input.addEventListener('focus', function() { this.dataset.oldValue = this.value; });
            });

            list.querySelectorAll('.desc-input').forEach(input => {
                input.addEventListener('change', async function() {
                    const item = this.closest('.prize-item');
                    const id = parseInt(item.dataset.id);
                    const value = this.value.trim();
                    const success = await updatePrize(id, { description: value });
                    if (success) { await refreshAll(); showNotification('✅ تم تحديث الوصف'); }
                    else { showError('❌ فشل تحديث الوصف'); await refreshAll(); }
                });
            });

            list.querySelectorAll('.prob-input').forEach(input => {
                input.addEventListener('change', async function() {
                    const item = this.closest('.prize-item');
                    const id = parseInt(item.dataset.id);
                    const val = parseFloat(this.value);
                    if (isNaN(val) || val < 0) { this.value = 0; return; }
                    if (val > 100) { this.value = 100; }
                    const success = await updatePrize(id, { probability: parseFloat(this.value) });
                    if (success) { await refreshAll(); showNotification('✅ تم تحديث النسبة'); }
                    else { showError('❌ فشل تحديث النسبة'); await refreshAll(); }
                });
            });

            list.querySelectorAll('.btn-save-prob').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const item = this.closest('.prize-item');
                    const id = parseInt(item.dataset.id);
                    const input = item.querySelector('.prob-input');
                    const val = parseFloat(input.value);
                    if (isNaN(val) || val < 0) { input.value = 0; return; }
                    if (val > 100) { input.value = 100; }
                    const success = await updatePrize(id, { probability: parseFloat(input.value) });
                    if (success) { await refreshAll(); showNotification('✅ تم حفظ النسبة'); }
                    else { showError('❌ فشل حفظ النسبة'); await refreshAll(); }
                });
            });

            list.querySelectorAll('.color-input').forEach(input => {
                input.addEventListener('change', async function() {
                    const id = parseInt(this.dataset.id);
                    const field = this.dataset.field;
                    const value = this.value;
                    const updateData = {};
                    updateData[field] = value;
                    const success = await updatePrize(id, updateData);
                    if (success) { await refreshAll(); showNotification(`✅ تم تحديث اللون`); }
                    else { showError('❌ فشل تحديث اللون'); await refreshAll(); }
                });

                btn.addEventListener('click', async function() {

        // ================================================================

        async function loadUserStatus() {
            if (!USER_ID) return;
            try {
                const res = await connectionManager.fetchWithRetry(`${API_BASE}/api/wheel/history/${USER_ID}`);
                const data = await res.json();
                if (data.success) {
                    const depositNotice = document.getElementById('depositNotice');
                    const depositStatus = document.getElementById('depositStatus');
                    if (data.deposit_requirement?.required) {
                        const minAmount = data.deposit_requirement.min_amount || 0;
                        const checkHours = data.deposit_requirement.check_hours || 24;
                        const currentDeposits = data.deposit_requirement.current_deposits || 0;
                        const isMet = data.deposit_requirement.is_met || false;
                        document.getElementById('depositMinAmount').textContent = minAmount;
                        document.getElementById('depositCheckHours').textContent = checkHours;
                        depositNotice.classList.add('show');
                        if (isMet) {
                            depositStatus.innerHTML = `الحالة: <span class="met">✅ مكتمل (${currentDeposits} SYP)</span>`;
                        } else {
                            depositStatus.innerHTML = `الحالة: <span class="not-met">❌ غير مكتمل (${currentDeposits}/${minAmount} SYP)</span>`;
                        }
                    } else {
                        depositNotice.classList.remove('show');
                    }
                    const spinBtn = document.getElementById('spinBtn');
                    const canSpin = data.spin_status?.can_spin !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
                    if (canSpin && prizesCache.length > 0) {
                        spinBtn.disabled = false;
                        document.getElementById('spinBtnText').textContent = '🔥 دوّر العجلة النارية';
                    } else if (!data.spin_status?.can_spin) {
                        spinBtn.disabled = true;
                        const h = data.spin_status?.remaining_hours || 0;
                        const m = data.spin_status?.remaining_minutes || 0;
                        document.getElementById('spinBtnText').textContent = `⏳ ${h}h ${m}m`;
                        soundManager.stopAll();
                    } else if (data.deposit_requirement?.required && !data.deposit_requirement?.is_met) {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '💰 إيداع مطلوب';
                        soundManager.stopAll();
                    } else {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) {
                console.error('Error loading user status:', e);
                showError('فشل تحميل حالة المستخدم: ' + e.message);
            }
        }

            await loadSettings();
            const prizes = await loadPrizes();
            drawWheel(prizes, -1, currentRotation);
            await loadUserStatus();
            await renderAdminPanel();
        }

        // ================================================================
        //                      تأثيرات الاحتفال
        // ================================================================
        function createConfetti(count = 60) {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#FFD700', '#FF6B00', '#FF2200', '#FF0000', '#FF6600', '#FFAA00', '#FF4400', '#FF8800'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const size = 6 + Math.random() * 14;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 40 + '%';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                el.style.animationDelay = Math.random() * 0.8 + 's';
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 3500);
        }

        function createWinEffects(prizeName) {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.add('winner');
            const name = document.getElementById('prizeName');
            name.classList.add('win-text');
            createConfetti(60);
            showNotification(`🔥 مبروك! لقد فزت بـ ${prizeName}!`);
        }

        function clearWinEffects() {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('winner');
            const name = document.getElementById('prizeName');
            name.classList.remove('win-text');
        }

        function showNotification(message) {
            const bar = document.getElementById('notificationBar');
            document.getElementById('notifPrizeName').textContent =
                message.replace('🔥 مبروك! لقد فزت بـ ', '').replace('!', '');
            bar.classList.add('show');
            setTimeout(() => { bar.classList.remove('show'); }, 4000);
        }

        // ================================================================
        //                      شاشة اللودينغ
        // ================================================================
        function updateLoading(progress) {
            const bar = document.getElementById('loaderProgressBar');
            const text = document.getElementById('loaderStatusText');
            bar.style.width = progress + '%';
            text.textContent = progress + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            const wrapper = document.getElementById('wheelWrapper');
            if (show) { screen.classList.add('active'); wrapper.classList.remove('show'); }
            else { screen.classList.remove('active'); wrapper.classList.add('show'); }
        }

        async function checkConnection() {
            try {
                await connectionManager.fetchWithRetry(`${API_BASE}/api/status`);
                return true;
            } catch (e) {
                console.error('Connection failed:', e);
                return false;
            }
        }

        // ================================================================
        //                      تدوير العجلة
        // ================================================================
        async function spinWheel() {
            if (isSpinning || !USER_ID) return;
            if (document.getElementById('spinBtn').disabled) return;
            if (prizesCache.length === 0) { showError('لا توجد جوائز متاحة'); return; }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('loading');
            document.getElementById('spinBtnText').textContent = '🔥 جاري التدوير...';

            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('errorMsg').classList.remove('show');
            clearWinEffects();

            soundManager.init();
            soundManager.playStartSound();
            setTimeout(() => soundManager.playSpinSound(), 300);

            try {
                const response = await connectionManager.fetchWithRetry(`${API_BASE}/api/wheel/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });

                const data = await response.json();
                spinBtn.classList.remove('loading');

                if (data.success) {
                    const prize = data.spin.prize;
                    const step = (2 * Math.PI) / prizesCache.length;
                    const prizeIndex = prizesCache.findIndex(p => p.id === prize.id);
                    const isWin = !prize.name.includes('حظ سعيد');

                    if (prizeIndex === -1) {
                        const randomIndex = Math.floor(Math.random() * prizesCache.length);
                        const targetAngle = (randomIndex / prizesCache.length) * 2 * Math.PI;
                        const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step / 2));
                        animateSpin(totalRotation, spinDuration, () => {
                            drawWheel(prizesCache, randomIndex, totalRotation);
                            showResult(prizesCache[randomIndex], isWin);
                        });
                    } else {
                        const targetAngle = (prizeIndex / prizesCache.length) * 2 * Math.PI;
                        const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step / 2));
                        animateSpin(totalRotation, spinDuration, () => {
                            drawWheel(prizesCache, prizeIndex, totalRotation);
                            showResult(prize, isWin);
                        });
                    }
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        const btn = document.getElementById('spinBtn');
                        btn.disabled = true;
                        document.getElementById('spinBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        soundManager.stopAll();
                    }
                    drawWheel(prizesCache, -1, currentRotation);
                }
            } catch (e) {
                spinBtn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                drawWheel(prizesCache, -1, currentRotation);
                soundManager.stopAll();
            }

            isSpinning = false;
            if (!document.getElementById('spinBtn').disabled) {
                document.getElementById('spinBtnText').textContent = '🔥 دوّر العجلة النارية';
            }
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            document.getElementById('prizeDesc').textContent = prize.description || prize.name || 'جائزة!';
            document.getElementById('resultBox').classList.add('show');
            soundManager.stopAll();
            if (isWin) {
                createWinEffects(prize.description || prize.name);
                soundManager.playWinSound();
            } else {
                soundManager.playLoseSound();
            }
            loadUserStatus();
        }

        // ================================================================
        //                      عرض الخطأ
        // ================================================================
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.querySelectorAll('.btn-save').forEach(btn => {
            btn.addEventListener('click', async function() {
                const key = this.dataset.setting;
                const fieldId = this.dataset.field;
                const type = this.dataset.type || 'text';
                let value = '';
                if (type === 'checkbox') value = document.getElementById(fieldId).checked;
                else value = document.getElementById(fieldId).value;
                const originalText = this.textContent;
                this.textContent = '⏳ جاري...';
                this.disabled = true;
                const success = await saveSetting(key, value);
                if (success) {
                    this.textContent = '✅ تم الحفظ';
                    this.classList.add('saved');
                    await refreshAll();
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.classList.remove('saved');
                        this.disabled = false;
                    }, 2000);
                } else {
                    this.textContent = '❌ فشل';
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.disabled = false;
                    }, 2000);
                }
            });
        });

        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const nameInput = document.getElementById('newPrizeName');
            const iconInput = document.getElementById('newPrizeIcon');
            const descInput = document.getElementById('newPrizeDesc');
            const probInput = document.getElementById('newPrizeProb');
            const colorInput = document.getElementById('newPrizeColor');
            const color2Input = document.getElementById('newPrizeColor2');
            const name = nameInput.value.trim();
            const icon = iconInput.value.trim() || '🎁';
            const description = descInput.value.trim() || '';
            const prob = parseFloat(probInput.value) || 10;
            const color = colorInput.value || '#1a1a2e';
            const color2 = color2Input.value || '#16213e';
            if (!name) { showError('⚠️ الرجاء إدخال اسم الجائزة'); nameInput.focus(); return; }
            if (prob < 0 || prob > 100) { showError('⚠️ النسبة يجب أن تكون بين 0 و 100'); probInput.focus(); return; }
            const btn = this;
            btn.disabled = true;
            btn.textContent = '⏳';
            const success = await addPrize(name, icon, description, prob, color, color2);
            if (success) {
                nameInput.value = '';
                iconInput.value = '';
                descInput.value = '';
                probInput.value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}" بنجاح`);
            } else { showError('❌ فشل إضافة الجائزة'); }
            btn.disabled = false;
            btn.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async function() {
            await refreshAll();
            showNotification('🔄 تم تحديث الكل');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async function() {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز إلى الإعدادات الافتراضية؟')) {
                const success = await resetPrizes();
                if (success) { await refreshAll(); showNotification('✅ تم إعادة تعيين الجوائز'); }
                else { showError('❌ فشل إعادة التعيين'); }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) soundManager.stopAll();
            else soundManager.init();
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            USER_ID = getUserId();
            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                document.getElementById('userStatus').style.display = 'none';
                return;
            }
            showLoading(true);
            updateLoading(0);
            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 12;
                    if (progress > 85) progress = 85;
                    updateLoading(Math.round(progress));
                }, 150);

                const isConnected = await checkConnection();
                if (!isConnected) {
                    clearInterval(interval);
                    updateLoading(100);
                    await new Promise(r => setTimeout(r, 400));
                    showLoading(false);
                    showError('⚠️ لا يمكن الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                    return;
                }

                updateLoading(30);
                await new Promise(r => setTimeout(r, 300));
                await loadSettings();
                updateLoading(50);
                await new Promise(r => setTimeout(r, 300));

                // ⚠️ رسم العجلة بعد تحميل الجوائز
                const prizes = await loadPrizes();
                drawWheel(prizes, -1, 0);
                updateLoading(70);
                await new Promise(r => setTimeout(r, 300));
                await loadUserStatus();
                updateLoading(85);
                await new Promise(r => setTimeout(r, 300));
                await renderAdminPanel();
                updateLoading(95);
                await new Promise(r => setTimeout(r, 300));
                clearInterval(interval);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 500));
                soundManager.init();
            } catch (e) {
                console.error('Init error:', e);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 600));
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }
            showLoading(false);
            document.getElementById('spinBtn').onclick = spinWheel;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
