<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>IChancy - Epic Fire Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050302;
            overflow-x: hidden;
            padding: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
        }

        /* ============ خلفية نارية ============ */
        .bg-image-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
            filter: brightness(0.3) saturate(1.5) contrast(1.25);
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .fire-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255, 80, 0, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 160, 0, 0.28) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 90%, rgba(200, 40, 0, 0.22) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(200, 40, 0, 0.22) 0%, transparent 50%);
            animation: firePulse 3s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }
        @keyframes firePulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        .embers-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ember {
            position: absolute;
            bottom: -20px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b0, #ff8c00 40%, #ff2200 80%, transparent);
            box-shadow: 0 0 12px #ff6600, 0 0 24px #ff2200;
            animation: emberRise linear infinite;
        }
        @keyframes emberRise {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(var(--drift, 40px)) scale(0.2); opacity: 0; }
        }

        .user-status { display: none; }

        /* ============================================================
           العجلة - السيوف خلفها
           ============================================================ */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            aspect-ratio: 1/1;
            display: none;
            z-index: 1;
            padding: 28px;
        }
        .wheel-wrapper.show {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .swords-behind {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== السيف الواقعي ===== */
        .sword {
            position: absolute;
            width: 26px;
            height: 130%;
            top: 50%; left: 50%;
            transform-origin: center center;
            filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 40, 0, 0.5));
        }
        .sword-left { transform: translate(-50%, -50%) rotate(-42deg) translateY(-12%); }
        .sword-right { transform: translate(-50%, -50%) rotate(42deg) translateY(-12%); }

        .sword-grip {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 22%;
            background: repeating-linear-gradient(45deg,
                #3d1f0a 0px, #3d1f0a 3px,
                #5a2e12 3px, #5a2e12 6px,
                #2a1405 6px, #2a1405 9px);
            border-radius: 3px;
            box-shadow: inset -2px 0 3px rgba(0,0,0,0.7), inset 2px 0 3px rgba(120,80,40,0.3);
            border: 1px solid #1a0d03;
        }
        .sword-pommel {
            position: absolute;
            bottom: -12px; left: 50%;
            transform: translateX(-50%);
            width: 22px; height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffdd55 0%, #cc9900 30%, #8b6508 70%, #4a3200 100%);
            box-shadow: 0 0 12px rgba(255, 200, 50, 0.9), 0 0 24px rgba(255, 100, 0, 0.6),
                inset 0 2px 3px rgba(255, 255, 200, 0.5), inset 0 -3px 4px rgba(0,0,0,0.7);
        }
        .sword-guard {
            position: absolute;
            bottom: 21%; left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 10px;
            background: linear-gradient(180deg, #ffdd55 0%, #cc9900 25%, #8b6508 50%, #5a4400 75%, #3a2c00 100%);
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(255, 200, 50, 0.9), 0 0 24px rgba(255, 100, 0, 0.5),
                inset 0 2px 2px rgba(255, 255, 200, 0.6), inset 0 -2px 3px rgba(0,0,0,0.7);
        }
        .sword-guard::before, .sword-guard::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffdd55, #8b6508);
            transform: translateY(-50%);
            box-shadow: 0 0 8px rgba(255, 180, 50, 0.9);
        }
        .sword-guard::before { left: -6px; }
        .sword-guard::after { right: -6px; }

        .sword-blade {
            position: absolute;
            bottom: 22%; left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 78%;
            background: linear-gradient(90deg,
                #1a1a1a 0%, #3a3a3a 12%, #7a7a7a 28%, #c8c8c8 42%, #f0f0f0 50%,
                #c8c8c8 58%, #7a7a7a 72%, #3a3a3a 88%, #1a1a1a 100%);
            clip-path: polygon(50% 0%, 88% 3%, 100% 12%, 100% 100%, 0% 100%, 0% 12%, 12% 3%);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.6), 0 0 10px rgba(255, 120, 0, 0.4);
        }
        .sword-blade::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #ffdd88 15%, #ff8800 35%, #ff4400 55%, #aa1100 75%, transparent 95%);
            filter: blur(1.5px);
            box-shadow: 0 0 12px #ff6600, 0 0 24px #ff3300, 0 0 40px #ff1100;
            animation: bladeFirePulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes bladeFirePulse {
            0% { opacity: 0.75; filter: blur(1.5px) brightness(1); }
            100% { opacity: 1; filter: blur(2px) brightness(1.4); }
        }
        .sword-blade::after {
            content: '';
            position: absolute;
            top: 8%; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 84%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(200,200,200,0.6) 50%, rgba(150,150,150,0.4) 100%);
            filter: blur(0.5px);
        }

        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           اللهب - ألسنة تخرج للخارج من الإطار
           ============================================================ */
        .fire-flames {
            position: absolute;
            top: -18px; left: -18px;
            width: calc(100% + 36px);
            height: calc(100% + 36px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .flame {
            position: absolute;
            width: 24px;
            height: 48px;
            border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
            background: radial-gradient(ellipse at 50% 100%,
                #fff8b0 0%,
                #ffdd00 18%,
                #ff8800 38%,
                #ff4400 58%,
                #aa1100 78%,
                transparent 92%);
            transform-origin: 50% 100%;
            filter: blur(1.5px) drop-shadow(0 0 12px rgba(255, 100, 0, 0.9));
            animation: flameDance 1.3s ease-in-out infinite alternate;
            opacity: 0.95;
        }
        .flame::before {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 60%;
            border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
            background: radial-gradient(ellipse at 50% 100%,
                #ffffff 0%,
                #fff8b0 25%,
                #ffdd00 60%,
                transparent 100%);
            filter: blur(1px);
            animation: flameInnerDance 0.8s ease-in-out infinite alternate;
        }
        @keyframes flameDance {
            0% { transform: scaleY(1) scaleX(1) rotate(-4deg); }
            50% { transform: scaleY(1.35) scaleX(0.85) rotate(3deg); }
            100% { transform: scaleY(1.1) scaleX(1.05) rotate(-2deg); }
        }
        @keyframes flameInnerDance {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.9; }
            100% { transform: translateX(-50%) scaleY(1.4) scaleX(0.75); opacity: 1; }
        }

        /* إطار ناري أساسي - نظيف وصغير */
        .fire-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            border: 4px solid transparent;
            background:
                linear-gradient(#050302, #050302) padding-box,
                conic-gradient(from 0deg,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200) border-box;
            box-shadow:
                0 0 15px rgba(255, 80, 0, 0.7),
                0 0 30px rgba(255, 40, 0, 0.4),
                inset 0 0 20px rgba(255, 100, 0, 0.35);
            animation: fireRingRotate 6s linear infinite;
        }
        @keyframes fireRingRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fire-halo {
            position: absolute;
            top: -15px; left: -15px;
            width: calc(100% + 30px);
            height: calc(100% + 30px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle,
                rgba(255, 120, 0, 0.28) 0%,
                rgba(255, 50, 0, 0.14) 40%,
                transparent 70%);
            filter: blur(12px);
            animation: haloPulse 2.5s ease-in-out infinite alternate;
        }
        @keyframes haloPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* شرر متطاير */
        .sparks-layer {
            position: absolute;
            top: -20px; left: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            overflow: visible;
        }
        .spark {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b0, #ff8800 40%, #ff2200 80%, transparent);
            box-shadow: 0 0 8px #ff6600, 0 0 16px #ff2200;
            animation: sparkFloat 2.5s ease-out infinite;
        }
        @keyframes sparkFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) translateX(var(--sx, 0)) scale(0); opacity: 0; }
        }

        /* ============================================================
           الرمح (يشير للأسفل نحو القسم الرابح)
           ============================================================ */
        .pointer {
            position: absolute;
            top: -68px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 44px;
            height: 108px;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 25px rgba(255, 40, 0, 0.6));
            animation: spearBounce 1.8s ease-in-out infinite;
        }
        @keyframes spearBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(5px); }
        }

        .spear-shaft {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 50px;
            background: linear-gradient(90deg,
                #2a1a0a 0%, #5a3a1a 25%, #8a5a2a 50%, #5a3a1a 75%, #2a1a0a 100%);
            border-radius: 2px;
            box-shadow: inset -1px 0 2px rgba(0,0,0,0.7), inset 1px 0 2px rgba(120,80,40,0.4);
        }
        .spear-feather {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 18px;
            background: linear-gradient(180deg, #ff4400 0%, #cc2200 50%, #8b0000 100%);
            clip-path: polygon(0% 0%, 15% 40%, 15% 100%, 85% 100%, 85% 40%, 100% 0%, 50% 20%);
            filter: drop-shadow(0 0 6px rgba(255, 60, 0, 0.8));
        }
        .spear-feather::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                transparent 0px, transparent 3px,
                rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px);
        }
        .spear-collar {
            position: absolute;
            top: 48px; left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 8px;
            background: linear-gradient(180deg, #ffdd55, #8b6508, #3a2c00);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 180, 50, 0.9);
        }
        .spear-tip {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 42px;
            background: linear-gradient(90deg,
                #1a1a1a 0%, #4a4a4a 20%, #b0b0b0 45%, #f0f0f0 50%,
                #b0b0b0 55%, #4a4a4a 80%, #1a1a1a 100%);
            clip-path: polygon(0% 0%, 100% 0%, 100% 30%, 50% 100%, 0% 30%);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5), 0 0 12px rgba(255, 120, 0, 0.7);
        }
        .spear-tip::before {
            content: '';
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 70%;
            background: linear-gradient(180deg, #ff4400, #ffaa00, #fff);
            filter: blur(0.8px);
            box-shadow: 0 0 8px #ff6600, 0 0 16px #ff2200;
        }

        /* ============================================================
           الشرر المتوهج حول العجلة
           ============================================================ */
        .glow-bubbles-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
            border-radius: 50%;
        }
        .glow-bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 200, 100, 0.9), rgba(255, 80, 0, 0.4) 50%, transparent 80%);
            box-shadow: 0 0 15px rgba(255, 120, 0, 0.8), 0 0 30px rgba(255, 40, 0, 0.5);
            pointer-events: none;
            animation: floatFire 8s infinite alternate ease-in-out;
            opacity: 0.85;
        }
        @keyframes floatFire {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(15px, -25px) scale(1.2); }
            50% { transform: translate(-10px, 20px) scale(0.8); }
            75% { transform: translate(20px, 15px) scale(1.1); }
            100% { transform: translate(-15px, -20px) scale(0.9); }
        }
        .glow-bubble:nth-child(1) { width: 10px; height: 10px; top: 10%; left: 12%; animation-duration: 6s; }
        .glow-bubble:nth-child(2) { width: 14px; height: 14px; top: 6%; right: 18%; animation-duration: 7s; animation-delay: 1s; }
        .glow-bubble:nth-child(3) { width: 8px; height: 8px; bottom: 18%; left: 8%; animation-duration: 5s; animation-delay: 2s; }
        .glow-bubble:nth-child(4) { width: 12px; height: 12px; bottom: 12%; right: 10%; animation-duration: 6.5s; animation-delay: 0.5s; }
        .glow-bubble:nth-child(5) { width: 9px; height: 9px; top: 48%; left: 3%; animation-duration: 7.5s; animation-delay: 3s; }
        .glow-bubble:nth-child(6) { width: 11px; height: 11px; top: 44%; right: 4%; animation-duration: 6s; animation-delay: 1.5s; }
        .glow-bubble:nth-child(7) { width: 7px; height: 7px; top: 72%; left: 22%; animation-duration: 5.5s; animation-delay: 0.3s; }
        .glow-bubble:nth-child(8) { width: 13px; height: 13px; top: 68%; right: 20%; animation-duration: 7s; animation-delay: 2.5s; }

        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.85),
                inset 0 0 40px rgba(255, 60, 0, 0.3),
                0 0 25px rgba(255, 80, 0, 0.4);
            border: none;
            transition: filter 0.4s ease;
            display: block;
            position: relative;
            z-index: 3;
            background: #0a0300;
        }
        .wheel-wrapper canvas.spinning {
            filter: brightness(1.15) contrast(1.1) drop-shadow(0 0 30px rgba(255, 80, 0, 0.6));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: #ff8866;
            font-size: 15px;
            background: rgba(20, 5, 0, 0.9);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 80, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.2);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            letter-spacing: 0.5px;
        }
        .btn-spin {
            background: linear-gradient(135deg,
                #8b0000 0%, #ff2200 25%, #ff6600 50%, #ffaa00 75%, #ff6600 100%);
            background-size: 200% 200%;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255, 200, 100, 0.6);
            box-shadow:
                0 0 20px rgba(255, 80, 0, 0.6),
                0 0 40px rgba(255, 40, 0, 0.3),
                inset 0 0 20px rgba(255, 200, 100, 0.2),
                inset 0 -3px 10px rgba(0, 0, 0, 0.5);
            font-size: 19px;
            animation: fireBtnPulse 2s ease-in-out infinite;
            border: 1px solid rgba(255, 180, 0, 0.5);
        }
        @keyframes fireBtnPulse {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 0 20px rgba(255, 80, 0, 0.6),
                            0 0 40px rgba(255, 40, 0, 0.3),
                            inset 0 0 20px rgba(255, 200, 100, 0.2);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 0 30px rgba(255, 120, 0, 0.9),
                            0 0 60px rgba(255, 40, 0, 0.5),
                            inset 0 0 25px rgba(255, 200, 100, 0.3);
            }
        }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); filter: brightness(1.15); }
        .btn-spin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            animation: none;
            filter: grayscale(0.6);
        }
        .btn-spin .spinner-small {
            display: none;
            width: 20px; height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-spin.loading .spinner-small { display: inline-block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .deposit-notice {
            background: rgba(20, 5, 0, 0.9);
            border: 1px solid rgba(255, 80, 0, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.2);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .deposit-notice.show { display: block; }
        .deposit-notice .notice-text { color: #ffaa44; font-size: 14px; }
        .deposit-notice .notice-text .amount { color: #ffdd44; font-weight: 800; text-shadow: 0 0 10px rgba(255, 200, 0, 0.8); }
        .deposit-notice .notice-status { font-size: 13px; margin-top: 4px; color: #888; }
        .deposit-notice .notice-status .met { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 100, 0.6); }
        .deposit-notice .notice-status .not-met { color: #ff4444; text-shadow: 0 0 8px rgba(255, 60, 60, 0.6); }

        .result-box {
            background: rgba(20, 5, 0, 0.92);
            border: 1px solid rgba(255, 80, 0, 0.3);
            border-radius: 18px;
            padding: 18px 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.3);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
        }

        // ================================================================
        //                      ConnectionManager
        // ================================================================
        class ConnectionManager {
            constructor() {
                this.maxRetries = 3;
                this.retryDelay = 2000;
                this.timeout = 50000;
            }
            async fetchWithRetry(url, options = {}, retryCount = 0) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), this.timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') throw new Error('انتهت مهلة الاتصال بالخادم (50 ثانية)');
                    if (retryCount < this.maxRetries) {
                        const delay = this.retryDelay * (retryCount + 1);
                        console.log(`محاولة إعادة الاتصال ${retryCount + 1}/${this.maxRetries} بعد ${delay}ms`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return this.fetchWithRetry(url, options, retryCount + 1);
                    }
                    throw error;
                }
            }
        }
        const connectionManager = new ConnectionManager();

        // ================================================================
        //   نظام الصوت الملحمي الناري
        // ================================================================
        class FireSoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
                this.noiseBuffer = null;
                this.spinSource = null;
                this.spinLfo = null;
                this.spinGain = null;
                this.spinInterval = null;
                this.ambientSource = null;
                this.ambientGain = null;
                this.ambientLfo = null;
                this.ambientFilter = null;
                this.ambientActive = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = this.audioContext.sampleRate * 3;
                    const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    this.noiseBuffer = buffer;
                    this.initialized = true;
                } catch (e) { console.warn('Web Audio not supported'); }
            }

            // ====== صوت الخلفية: هدير لهب هادئ مستمر ======
            startAmbient() {
                if (!soundEnabled || !this.initialized || this.ambientActive) return;
                try {
                    const ctx = this.audioContext;
                    // مصدر ضوضاء
                    const source = ctx.createBufferSource();
                    source.buffer = this.noiseBuffer;
                    source.loop = true;

                    // فلتر منخفض لتشكيل الهدير
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 450;
                    filter.Q.value = 1.2;

                    // فلتر ثانٍ للتحكم بالترددات العالية
                    const filter2 = ctx.createBiquadFilter();
                    filter2.type = 'lowpass';
                    filter2.frequency.value = 900;

                    // كسب منخفض جداً
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.035, ctx.currentTime + 1.5);

                    // LFO بطيء لتذبذب صوت اللهب
                    const lfo = ctx.createOscillator();
                    lfo.frequency.value = 0.3;
                    lfo.type = 'sine';
                    const lfoGain = ctx.createGain();
                    lfoGain.gain.value = 100;
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);

                    source.connect(filter);
                    filter.connect(filter2);
                    filter2.connect(gain);
                    gain.connect(ctx.destination);

                    source.start();
                    lfo.start();

                    this.ambientSource = source;
                    this.ambientGain = gain;
                    this.ambientLfo = lfo;
                    this.ambientFilter = filter;
                    this.ambientActive = true;
                } catch (e) { console.warn('ambient err', e); }
            }

            stopAmbient() {
                if (!this.ambientActive || !this.ambientGain) return;
                try {
                    const ctx = this.audioContext;
                    const g = this.ambientGain.gain;
                    g.cancelScheduledValues(ctx.currentTime);
                    g.setValueAtTime(g.value, ctx.currentTime);
                    g.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                    const s = this.ambientSource;
                    const l = this.ambientLfo;
                    setTimeout(() => {
                        try { s.stop(); l.stop(); } catch (e) {}
                    }, 600);
                } catch (e) {}
                this.ambientActive = false;
                this.ambientSource = null;
                this.ambientGain = null;
                this.ambientLfo = null;
            }

            // ====== إيقاف كل الأصوات ======
            stopAll() {
                this.stopSpinSound();
                this.stopAmbient();
            }

            // ====== صوت التدوير: هدير لهب + شرر ======
            playSpinSound() {
                if (!soundEnabled || !this.initialized) return;
                this.stopSpinSound();
                try {
                    const ctx = this.audioContext;

                    const source = ctx.createBufferSource();
                    source.buffer = this.noiseBuffer;
                    source.loop = true;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(900, ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(350, ctx.currentTime + 3.5);

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.09, ctx.currentTime + 0.4);
                    gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 3.2);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.8);

                    const lfo = ctx.createOscillator();
                    lfo.frequency.value = 9;
                    lfo.type = 'sine';
                    const lfoGain = ctx.createGain();
                    lfoGain.gain.value = 180;
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);

                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    source.start();
                    lfo.start();
                    this.spinSource = source;
                    this.spinLfo = lfo;
                    this.spinGain = gain;

                    setTimeout(() => {
                        try { source.stop(); lfo.stop(); } catch (e) {}
                        this.spinSource = null;
                    }, 4200);

                    // شرر خفيف
                    let cnt = 0;
                    if (this.spinInterval) clearInterval(this.spinInterval);
                    this.spinInterval = setInterval(() => {
                        if (!soundEnabled) { clearInterval(this.spinInterval); return; }
                        try {
                            const t = ctx.currentTime;
                            const osc = ctx.createOscillator();
                            const g = ctx.createGain();
                            osc.connect(g);
                            g.connect(ctx.destination);
                            osc.frequency.setValueAtTime(1200 + Math.random() * 1400, t);
                            osc.type = 'triangle';
                            g.gain.setValueAtTime(0.018, t);
                            g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                            osc.start(t);
                            osc.stop(t + 0.05);
                            cnt++;
                            if (cnt > 35) clearInterval(this.spinInterval);
                        } catch (e) {}
                    }, 110);
                } catch (e) { console.warn('spin err', e); }
            }

            stopSpinSound() {
                if (this.spinInterval) {
                    clearInterval(this.spinInterval);
                    this.spinInterval = null;
                }
                if (this.spinSource) {
                    try { this.spinSource.stop(); } catch (e) {}
                    this.spinSource = null;
                }
                if (this.spinLfo) {
                    try { this.spinLfo.stop(); } catch (e) {}
                    this.spinLfo = null;
                }
                this.spinGain = null;
            }

            // ====== صوت الفوز: انفجار + لحن انتصار + هدير ======
            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;

                    // 1) انفجار افتتاحي
                    const burst = ctx.createBufferSource();
                    burst.buffer = this.noiseBuffer;
                    const bFilter = ctx.createBiquadFilter();
                    bFilter.type = 'lowpass';
                    bFilter.frequency.setValueAtTime(3000, now);
                    bFilter.frequency.exponentialRampToValueAtTime(200, now + 0.7);
                    const bGain = ctx.createGain();
                    bGain.gain.setValueAtTime(0.3, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    burst.connect(bFilter);
                    bFilter.connect(bGain);
                    bGain.connect(ctx.destination);
                    burst.start(now);
                    burst.stop(now + 0.8);

                    // 2) لحن انتصار ملحمي (صاعد)
                    const melody = [
                        [392, 0.16, 'sawtooth'],
                        [523, 0.16, 'sawtooth'],
                        [659, 0.16, 'square'],
                        [784, 0.20, 'square'],
                        [988, 0.22, 'square'],
                        [1175, 0.35, 'square'],
                        [1568, 0.5, 'square']
                    ];
                    melody.forEach(([freq, dur, type], i) => {
                        const start = now + 0.1 + i * 0.14;
                        // نغمة رئيسية
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g);
                        g.connect(ctx.destination);
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, start);
                        g.gain.setValueAtTime(0.0, start);
                        g.gain.linearRampToValueAtTime(0.075, start + 0.015);
                        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
                        osc.start(start);
                        osc.stop(start + dur);

                        // نغمة ثانية (هارموني)
                        const osc2 = ctx.createOscillator();
                        const g2 = ctx.createGain();
                        osc2.connect(g2);
                        g2.connect(ctx.destination);
                        osc2.type = 'sine';
                        osc2.frequency.setValueAtTime(freq * 2, start);
                        g2.gain.setValueAtTime(0.0, start);
                        g2.gain.linearRampToValueAtTime(0.03, start + 0.015);
                        g2.gain.exponentialRampToValueAtTime(0.001, start + dur);
                        osc2.start(start);
                        osc2.stop(start + dur);
                    });

                    // 3) هدير ناري خلفي
                    const roar = ctx.createBufferSource();
                    roar.buffer = this.noiseBuffer;
                    const rFilter = ctx.createBiquadFilter();
                    rFilter.type = 'bandpass';
                    rFilter.frequency.setValueAtTime(400, now + 0.9);
                    rFilter.Q.setValueAtTime(0.9, now + 0.9);
                    const rGain = ctx.createGain();
                    rGain.gain.setValueAtTime(0.0, now + 0.9);
                    rGain.gain.linearRampToValueAtTime(0.1, now + 1.3);
                    rGain.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
                    roar.connect(rFilter);
                    rFilter.connect(rGain);
                    rGain.connect(ctx.destination);
                    roar.start(now + 0.9);
                    roar.stop(now + 3.3);

                    // 4) شرر احتفالي
                    for (let i = 0; i < 12; i++) {
                        const t = now + 1 + Math.random() * 2;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g);
                        g.connect(ctx.destination);
                        osc.frequency.setValueAtTime(2000 + Math.random() * 2000, t);
                        osc.type = 'sine';
                        g.gain.setValueAtTime(0.015, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                        osc.start(t);
                        osc.stop(t + 0.15);
                    }
                } catch (e) { console.warn('win err', e); }
            }

            // ====== صوت الخسارة: حرق + تلاشي + نغمة داكنة ======
            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;

                    // 1) صوت حرق/تلاشي
                    const burn = ctx.createBufferSource();
                    burn.buffer = this.noiseBuffer;
                    const bF = ctx.createBiquadFilter();
                    bF.type = 'lowpass';
                    bF.frequency.setValueAtTime(1200, now);
                    bF.frequency.exponentialRampToValueAtTime(150, now + 1.3);
                    const bG = ctx.createGain();
                    bG.gain.setValueAtTime(0.13, now);
                    bG.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
                    burn.connect(bF);
                    bF.connect(bG);
                    bG.connect(ctx.destination);
                    burn.start(now);
                    burn.stop(now + 1.4);

                    // 2) نغمة هبوط حزينة (تون منخفض)
                    const notes = [
                        [392, 0.3, 'sawtooth'],
                        [311, 0.35, 'sawtooth'],
                        [261, 0.4, 'triangle'],
                        [196, 0.6, 'triangle'],
                        [130, 0.7, 'sine']
                    ];
                    notes.forEach(([freq, dur, type], i) => {
                        const start = now + i * 0.22;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g);
                        g.connect(ctx.destination);
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, start);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.6, start + dur);
                        g.gain.setValueAtTime(0.07, start);
                        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
                        osc.start(start);
                        osc.stop(start + dur);
                    });

                    // 3) همهمة منخفضة في النهاية (غروب)
                    const drone = ctx.createOscillator();
                    const dGain = ctx.createGain();
                    drone.connect(dGain);
                    dGain.connect(ctx.destination);
                    drone.frequency.setValueAtTime(80, now + 1);
                    drone.type = 'sine';
                    dGain.gain.setValueAtTime(0.0, now + 1);
                    dGain.gain.linearRampToValueAtTime(0.04, now + 1.3);
                    dGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
                    drone.start(now + 1);
                    drone.stop(now + 2.5);
                } catch (e) { console.warn('lose err', e); }
            }

            // ====== صوت الإشعال (start) ======
            playStartSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const noise = ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(300, now);
                    filter.frequency.exponentialRampToValueAtTime(3000, now + 0.5);
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                    noise.stop(now + 0.55);
                } catch (e) { console.warn('start err', e); }
            }
        }
        const soundManager = new FireSoundManager();

        // ================================================================
        //   رسم العجلة - أقسام حمم بركانية واضحة
        // ================================================================
        function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const r = Math.min(w, h) / 2 - 12;
            const noPrizes = document.getElementById('noPrizes');
            const wrapper = document.getElementById('wheelWrapper');

            if (!prizes || prizes.length === 0) {
                noPrizes.style.display = 'block';
                wrapper.classList.remove('show');
                return;
            }
            noPrizes.style.display = 'none';
            wrapper.classList.add('show');
            ctx.clearRect(0, 0, w, h);

            const total = prizes.length;
            const step = (2 * Math.PI) / total;

            // خلفية
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a0300';
            ctx.fill();

            prizes.forEach((p, i) => {
                const start = i * step + rotation - Math.PI / 2;
                const end = start + step;
                const isHighlight = (i === highlightIndex);

                // ===== 1) القطاع الأساسي بتدرج الحمم =====
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                if (isHighlight) {
                    grad.addColorStop(0, '#fff5b0');
                    grad.addColorStop(0.2, '#ffdd00');
                    grad.addColorStop(0.5, '#ff8800');
                    grad.addColorStop(0.8, '#ff4400');
                    grad.addColorStop(1, '#aa1100');
                } else {
                    // تدرج حمم لكل قطاع - كل قطاع يختلف قليلاً
                    const baseSeed = i * 0.1;
                    grad.addColorStop(0, `hsl(${10 + baseSeed * 5}, 95%, 25%)`);
                    grad.addColorStop(0.3, `hsl(${8 + baseSeed * 5}, 90%, 15%)`);
                    grad.addColorStop(0.6, `hsl(${5 + baseSeed * 5}, 85%, 9%)`);
                    grad.addColorStop(1, '#0a0200');
                }
                ctx.fillStyle = grad;
                ctx.fill();

                // ===== 2) شقوق الحمم داخل القطاع =====
                if (!isHighlight) {
                    ctx.save();
                    // مسار القطاع (يجب إعادة إنشائه قبل clip)
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, start, end);
                    ctx.closePath();
                    ctx.clip();

                    // 3 شقوق عشوائية
                    const veins = 3;
                    for (let v = 0; v < veins; v++) {
                        const aOff = start + step * (0.25 + v * 0.25) + (Math.random() - 0.5) * 0.1;
                        const rStart = r * (0.15 + Math.random() * 0.1);
                        const rEnd = r * (0.7 + Math.random() * 0.15);
                        const x1 = cx + Math.cos(aOff) * rStart;
                        const y1 = cy + Math.sin(aOff) * rStart;
                        const x2 = cx + Math.cos(aOff) * rEnd;
                        const y2 = cy + Math.sin(aOff) * rEnd;

                        // هالة برتقالية
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = 'rgba(255, 100, 0, 0.75)';
                        ctx.lineWidth = 6;
                        ctx.shadowColor = '#ff4400';
                        ctx.shadowBlur = 18;
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        // خط حمم ذهبي
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = '#ffdd33';
                        ctx.lineWidth = 2.5;
                        ctx.shadowColor = '#ffaa00';
                        ctx.shadowBlur = 10;
                        ctx.stroke();

                        // نقطة متوهجة
                        ctx.beginPath();
                        ctx.arc(x1 + (x2 - x1) * 0.4, y1 + (y2 - y1) * 0.4, 3.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffee88';
                        ctx.shadowColor = '#ffaa00';
                        ctx.shadowBlur = 12;
                        ctx.fill();
                    }
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }

                // ===== 3) حدود القطاع =====
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();
                ctx.strokeStyle = isHighlight ? 'rgba(255, 240, 150, 1)' : 'rgba(255, 130, 20, 0.85)';
                ctx.lineWidth = isHighlight ? 4 : 2;
                ctx.shadowColor = isHighlight ? '#ffdd00' : '#ff4400';
                ctx.shadowBlur = isHighlight ? 25 : 10;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // ===== 4) الأيقونة =====
                const mid = start + step / 2;
                const tr = r * 0.68;
                const x = cx + Math.cos(mid) * tr;
                const y = cy + Math.sin(mid) * tr;

                ctx.save();
                ctx.translate(x, y);
                let rotFix = (mid > Math.PI / 2 && mid < 3 * Math.PI / 2) ? Math.PI : 0;
                ctx.rotate(mid + rotFix);

                ctx.shadowColor = isHighlight ? '#ffdd00' : '#ff6600';
                ctx.shadowBlur = isHighlight ? 30 : 18;
                const iconSize = isHighlight ? 36 : 30;
                ctx.font = `bold ${iconSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = isHighlight ? '#ffffff' : '#ffe8b0';
                ctx.fillText(p.icon || '🎁', 0, 0);
                ctx.shadowBlur = 0;
                ctx.restore();

                // ===== 5) الوصف =====
                if (p.description) {
                    const textR = r * 0.88;
                    const tx = cx + Math.cos(mid) * textR;
                    const ty = cy + Math.sin(mid) * textR;
                    ctx.save();
                    ctx.translate(tx, ty);
                    let txtFix = (mid > Math.PI / 2 && mid < 3 * Math.PI / 2) ? Math.PI : 0;
                    ctx.rotate(mid + txtFix);
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = isHighlight ? '#0a0505' : '#ffddaa';
                    ctx.shadowColor = isHighlight ? '#fff5b0' : '#000000';
                    ctx.shadowBlur = 6;
                    let txt = p.description;
                    if (txt.length > 12) txt = txt.substring(0, 12) + '…';
                    ctx.fillText(txt, 0, 0);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            });

            // ===== 6) المركز =====
            const centerR = r * 0.15;
            const centerIcon = settingsCache.center_icon || '🔥';
            const cGrad = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, centerR);
            cGrad.addColorStop(0, '#fff8b0');
            cGrad.addColorStop(0.25, '#ffdd00');
            cGrad.addColorStop(0.6, '#ff6600');
            cGrad.addColorStop(1, '#8b0000');

            ctx.beginPath();
            ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
            ctx.fillStyle = cGrad;
            ctx.shadowColor = 'rgba(255, 140, 0, 0.9)';
            ctx.shadowBlur = 45;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(cx, cy, centerR + 4, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0a0505';
            ctx.font = '34px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 220, 100, 0.8)';
            ctx.shadowBlur = 15;
            ctx.fillText(centerIcon, cx, cy + 1);
            ctx.shadowBlur = 0;
        }

        // ================================================================

        // ================================================================
        function animateSpin(targetRotation, duration, callback) {
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');
            const startRotation = currentRotation;
            const startTime = performance.now();
            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startRotation + (targetRotation - startRotation) * easeOutCubic;
                currentRotation = currentAngle;
                drawWheel(prizesCache, -1, currentAngle);
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    canvas.classList.remove('spinning');
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animate);
        }

                            depositStatus.innerHTML = `الحالة: <span class="met">✅ مكتمل (${currentDeposits} SYP)</span>`;
                        } else {
                            depositStatus.innerHTML = `الحالة: <span class="not-met">❌ غير مكتمل (${currentDeposits}/${minAmount} SYP)</span>`;
                        }
                    } else {
                        depositNotice.classList.remove('show');
                    }
                    const spinBtn = document.getElementById('spinBtn');
                    const canSpin = data.spin_status?.can_spin !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
                    if (canSpin && prizesCache.length > 0) {
                        spinBtn.disabled = false;
                        document.getElementById('spinBtnText').textContent = '🔥 دوّر العجلة النارية';
                    } else if (!data.spin_status?.can_spin) {
                        spinBtn.disabled = true;
                        const h = data.spin_status?.remaining_hours || 0;
                        const m = data.spin_status?.remaining_minutes || 0;
                        document.getElementById('spinBtnText').textContent = `⏳ ${h}h ${m}m`;
                    } else if (data.deposit_requirement?.required && !data.deposit_requirement?.is_met) {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '💰 إيداع مطلوب';
                    } else {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) {
                console.error('Error loading user status:', e);
                showError('فشل تحميل حالة المستخدم: ' + e.message);
            }
        }

        async function refreshAll() {
            await loadSettings();
            const prizes = await loadPrizes();
            drawWheel(prizes, -1, currentRotation);
            await loadUserStatus();
            await renderAdminPanel();
        }

        function createConfetti(count = 60) {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#FFD700', '#FF6B00', '#FF2200', '#FF0000', '#FF6600', '#FFAA00', '#FF4400', '#FF8800'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const size = 6 + Math.random() * 14;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 40 + '%';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                el.style.animationDelay = Math.random() * 0.8 + 's';
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 3500);
        }

        function createWinEffects(prizeName) {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.add('winner');
            createConfetti(60);
            showNotification(`🔥 مبروك! لقد فزت بـ ${prizeName}!`);
        }

        function clearWinEffects() {
            document.getElementById('resultBox').classList.remove('winner');
        }

        function showNotification(message) {
            const bar = document.getElementById('notificationBar');
            document.getElementById('notifPrizeName').textContent =
                message.replace('🔥 مبروك! لقد فزت بـ ', '').replace('!', '');
            bar.classList.add('show');
            setTimeout(() => { bar.classList.remove('show'); }, 4000);
        }

        function updateLoading(progress) {
            document.getElementById('loaderProgressBar').style.width = progress + '%';
            document.getElementById('loaderStatusText').textContent = progress + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            const wrapper = document.getElementById('wheelWrapper');
            if (show) { screen.classList.add('active'); wrapper.classList.remove('show'); }
            else { screen.classList.remove('active'); wrapper.classList.add('show'); }
        }

        async function checkConnection() {
            try {
                await connectionManager.fetchWithRetry(`${API_BASE}/api/status`);
                return true;
            } catch (e) {
                console.error('Connection failed:', e);
                return false;
            }
        }

        // ================================================================
        //                      تدوير العجلة
        // ================================================================
        async function spinWheel() {
            if (isSpinning || !USER_ID) return;
            if (document.getElementById('spinBtn').disabled) return;
            if (prizesCache.length === 0) { showError('لا توجد جوائز متاحة'); return; }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('loading');
            document.getElementById('spinBtnText').textContent = '🔥 جاري التدوير...';

            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('errorMsg').classList.remove('show');
            clearWinEffects();

            // إيقاف صوت الخلفية أثناء التدوير
            soundManager.init();
            soundManager.stopAmbient();
            soundManager.playStartSound();
            setTimeout(() => soundManager.playSpinSound(), 250);

            try {
                const response = await connectionManager.fetchWithRetry(`${API_BASE}/api/wheel/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });

                const data = await response.json();
                spinBtn.classList.remove('loading');

                if (data.success) {
                    const prize = data.spin.prize;
                    const step = (2 * Math.PI) / prizesCache.length;
                    const prizeIndex = prizesCache.findIndex(p => p.id === prize.id);
                    const isWin = !prize.name.includes('حظ سعيد');

                    let finalIndex = prizeIndex;
                    if (finalIndex === -1) finalIndex = Math.floor(Math.random() * prizesCache.length);

                    const targetAngle = (finalIndex / prizesCache.length) * 2 * Math.PI;
                    const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step / 2));

                    animateSpin(totalRotation, spinDuration, () => {
                        drawWheel(prizesCache, finalIndex, totalRotation);
                        showResult(prizeIndex === -1 ? prizesCache[finalIndex] : prize, isWin);
                    });
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                    }
                    drawWheel(prizesCache, -1, currentRotation);
                    soundManager.stopAll();
                    // إعادة صوت الخلفية
                    setTimeout(() => soundManager.startAmbient(), 500);
                }
            } catch (e) {
                spinBtn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                drawWheel(prizesCache, -1, currentRotation);
                soundManager.stopAll();
                setTimeout(() => soundManager.startAmbient(), 500);
            }

            isSpinning = false;
            if (!document.getElementById('spinBtn').disabled) {
                document.getElementById('spinBtnText').textContent = '🔥 دوّر العجلة النارية';
            }
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            document.getElementById('prizeDesc').textContent = prize.description || prize.name || 'جائزة!';
            document.getElementById('resultBox').classList.add('show');
            soundManager.stopSpinSound();
            if (isWin) {
                createWinEffects(prize.description || prize.name);
                soundManager.playWinSound();
            } else {
                soundManager.playLoseSound();
            }
            loadUserStatus();
            // إعادة صوت الخلفية بعد 3 ثوان
            setTimeout(() => soundManager.startAmbient(), 3000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.querySelectorAll('.btn-save').forEach(btn => {
            btn.addEventListener('click', async function() {
                const key = this.dataset.setting;
                const fieldId = this.dataset.field;
                const type = this.dataset.type || 'text';
                let value = '';
                if (type === 'checkbox') value = document.getElementById(fieldId).checked;
                else value = document.getElementById(fieldId).value;
                const originalText = this.textContent;
                this.textContent = '⏳ جاري...';
                this.disabled = true;
                const success = await saveSetting(key, value);
                if (success) {
                    this.textContent = '✅ تم الحفظ';
                    this.classList.add('saved');
                    await refreshAll();
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.classList.remove('saved');
                        this.disabled = false;
                    }, 2000);
                } else {
                    this.textContent = '❌ فشل';
                    setTimeout(() => { this.textContent = originalText; this.disabled = false; }, 2000);
                }
            });
        });

        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const nameInput = document.getElementById('newPrizeName');
            const iconInput = document.getElementById('newPrizeIcon');
            const descInput = document.getElementById('newPrizeDesc');
            const probInput = document.getElementById('newPrizeProb');
            const colorInput = document.getElementById('newPrizeColor');
            const color2Input = document.getElementById('newPrizeColor2');
            const name = nameInput.value.trim();
            const icon = iconInput.value.trim() || '🎁';
            const description = descInput.value.trim() || '';
            const prob = parseFloat(probInput.value) || 10;
            const color = colorInput.value || '#1a1a2e';
            const color2 = color2Input.value || '#16213e';
            if (!name) { showError('⚠️ الرجاء إدخال اسم الجائزة'); nameInput.focus(); return; }
            if (prob < 0 || prob > 100) { showError('⚠️ النسبة يجب أن تكون بين 0 و 100'); probInput.focus(); return; }
            const btn = this;
            btn.disabled = true;
            btn.textContent = '⏳';
            const success = await addPrize(name, icon, description, prob, color, color2);
            if (success) {
                nameInput.value = '';
                iconInput.value = '';
                descInput.value = '';
                probInput.value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}" بنجاح`);
            } else { showError('❌ فشل إضافة الجائزة'); }
            btn.disabled = false;
            btn.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async function() {
            await refreshAll();
            showNotification('🔄 تم تحديث الكل');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async function() {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز إلى الإعدادات الافتراضية؟')) {
                const success = await resetPrizes();
                if (success) { await refreshAll(); showNotification('✅ تم إعادة تعيين الجوائز'); }
                else { showError('❌ فشل إعادة التعيين'); }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) {
                soundManager.stopAll();
            } else {
                soundManager.init();
                soundManager.startAmbient();
            }
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            USER_ID = getUserId();
            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                document.getElementById('userStatus').style.display = 'none';
                return;
            }
            showLoading(true);
            updateLoading(0);
            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 12;
                    if (progress > 85) progress = 85;
                    updateLoading(Math.round(progress));
                }, 150);

                const isConnected = await checkConnection();
                if (!isConnected) {
                    clearInterval(interval);
                    updateLoading(100);
                    await new Promise(r => setTimeout(r, 400));
                    showLoading(false);
                    showError('⚠️ لا يمكن الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                    return;
                }

                updateLoading(30);
                await new Promise(r => setTimeout(r, 300));
                await loadSettings();
                updateLoading(50);
                await new Promise(r => setTimeout(r, 300));
                const prizes = await loadPrizes();
                drawWheel(prizes, -1, 0);
                updateLoading(70);
                await new Promise(r => setTimeout(r, 300));
                await loadUserStatus();
                updateLoading(85);
                await new Promise(r => setTimeout(r, 300));
                await renderAdminPanel();
                updateLoading(95);
                await new Promise(r => setTimeout(r, 300));
                clearInterval(interval);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 500));
                soundManager.init();
                // بدء صوت الخلفية (هدير لهب هادئ)
                setTimeout(() => soundManager.startAmbient(), 300);
            } catch (e) {
                console.error('Init error:', e);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 600));
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }
            showLoading(false);
            document.getElementById('spinBtn').onclick = spinWheel;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
