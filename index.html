<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>IChancy - Epic Fire Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050302;
            overflow-x: hidden;
            padding: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
        }

        /* ============ خلفية نارية ملحمية ============ */
        .bg-image-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
            filter: brightness(0.35) saturate(1.4) contrast(1.2);
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* طبقة لهب ملحمية فوق الخلفية */
        .fire-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(255, 80, 0, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 160, 0, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 90%, rgba(200, 40, 0, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(200, 40, 0, 0.2) 0%, transparent 50%);
            animation: firePulse 3s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }
        @keyframes firePulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* جزيئات شرر متطايرة في الخلفية */
        .embers-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ember {
            position: absolute;
            bottom: -20px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8b0, #ff8c00 40%, #ff2200 80%, transparent);
            box-shadow: 0 0 12px #ff6600, 0 0 24px #ff2200;
            animation: emberRise linear infinite;
        }
        @keyframes emberRise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) translateX(var(--drift, 40px)) scale(0.2);
                opacity: 0;
            }
        }

        .user-status { display: none; }

        /* ============ العجلة الملحمية النارية ============ */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            aspect-ratio: 1/1;
            display: none;
            z-index: 1;
            padding: 30px;
        }
        .wheel-wrapper.show {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============ الإطار الناري الخارجي - ألسنة لهب ============ */
        .fire-frame {
            position: absolute;
            top: -10px; left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            background:
                radial-gradient(circle at 50% 50%,
                    transparent 62%,
                    rgba(255, 100, 0, 0.25) 66%,
                    rgba(255, 60, 0, 0.45) 70%,
                    rgba(200, 20, 0, 0.6) 74%,
                    transparent 78%);
            filter: blur(3px);
            animation: fireFramePulse 1.8s ease-in-out infinite alternate;
        }
        @keyframes fireFramePulse {
            0% {
                transform: scale(1) rotate(0deg);
                filter: blur(3px) brightness(1);
            }
            50% {
                transform: scale(1.01) rotate(1deg);
                filter: blur(4px) brightness(1.2);
            }
            100% {
                transform: scale(1.02) rotate(-1deg);
                filter: blur(3px) brightness(1.1);
            }
        }

        /* إطار داخلي مشتعل */
        .fire-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            border: 5px solid transparent;
            background:
                linear-gradient(#050302, #050302) padding-box,
                conic-gradient(from 0deg,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200, #ff6600, #ffcc00, #ff8800, #ff3300,
                    #ff2200) border-box;
            box-shadow:
                0 0 25px rgba(255, 80, 0, 0.7),
                0 0 50px rgba(255, 40, 0, 0.5),
                0 0 90px rgba(255, 20, 0, 0.3),
                inset 0 0 30px rgba(255, 100, 0, 0.4);
            animation: fireRingRotate 6s linear infinite;
        }
        @keyframes fireRingRotate {
            0% { transform: rotate(0deg); filter: hue-rotate(0deg); }
            100% { transform: rotate(360deg); filter: hue-rotate(20deg); }
        }

        /* هالة نارية خارجية */
        .fire-halo {
            position: absolute;
            top: -25px; left: -25px;
            width: calc(100% + 50px);
            height: calc(100% + 50px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle,
                rgba(255, 100, 0, 0.3) 0%,
                rgba(255, 50, 0, 0.15) 40%,
                transparent 70%);
            filter: blur(15px);
            animation: haloPulse 2.5s ease-in-out infinite alternate;
        }
        @keyframes haloPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.08); }
        }

        /* ============ السيوف المتقاطعة ============ */
        .swords-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 140%;
            height: 140%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        .sword {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px;
            height: 75%;
            transform-origin: center center;
            filter: drop-shadow(0 0 8px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 20px rgba(255, 40, 0, 0.6));
        }
        .sword-left {
            transform: translate(-50%, -50%) rotate(-45deg) translateY(-70%);
        }
        .sword-right {
            transform: translate(-50%, -50%) rotate(45deg) translateY(-70%);
        }

        .sword-blade {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 70%;
            background: linear-gradient(90deg,
                #1a1a1a 0%,
                #4a4a4a 20%,
                #d0d0d0 45%,
                #ffffff 50%,
                #d0d0d0 55%,
                #4a4a4a 80%,
                #1a1a1a 100%);
            clip-path: polygon(50% 0%, 80% 15%, 80% 100%, 20% 100%, 20% 15%);
            box-shadow: 0 0 15px rgba(255, 120, 0, 0.8), inset 0 0 8px rgba(255, 200, 100, 0.6);
        }
        .sword-blade::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #fff 0%, #ff8800 30%, #ff2200 60%, transparent 100%);
            filter: blur(1px);
            box-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300;
        }
        .sword-blade::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), transparent);
            clip-path: polygon(50% 0%, 80% 15%, 80% 100%, 20% 100%, 20% 15%);
            animation: bladeGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes bladeGlow {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .sword-guard {
            position: absolute;
            top: 70%; left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 8px;
            background: linear-gradient(180deg, #ffcc00, #b8860b, #8b6508);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255, 180, 0, 0.9), inset 0 0 5px rgba(0,0,0,0.5);
        }
        .sword-handle {
            position: absolute;
            top: 78%; left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 18%;
            background: repeating-linear-gradient(0deg,
                #2a1a0a, #2a1a0a 3px,
                #4a2a0a 3px, #4a2a0a 6px);
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
        }
        .sword-pommel {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #b8860b 60%, #4a2a00);
            box-shadow: 0 0 10px rgba(255, 180, 0, 0.9);
        }

        /* ============ الفقاعات النارية (شرر) ============ */
        .glow-bubbles-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
            border-radius: 50%;
        }
        .glow-bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 200, 100, 0.9), rgba(255, 80, 0, 0.4) 50%, transparent 80%);
            box-shadow: 0 0 15px rgba(255, 120, 0, 0.8), 0 0 30px rgba(255, 40, 0, 0.5);
            pointer-events: none;
            animation: floatFire 8s infinite alternate ease-in-out;
            opacity: 0.85;
        }
        @keyframes floatFire {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(15px, -25px) scale(1.2); }
            50% { transform: translate(-10px, 20px) scale(0.8); }
            75% { transform: translate(20px, 15px) scale(1.1); }
            100% { transform: translate(-15px, -20px) scale(0.9); }
        }
        .glow-bubble:nth-child(1) { width: 10px; height: 10px; top: 10%; left: 12%; animation-duration: 6s; }
        .glow-bubble:nth-child(2) { width: 14px; height: 14px; top: 6%; right: 18%; animation-duration: 7s; animation-delay: 1s; }
        .glow-bubble:nth-child(3) { width: 8px; height: 8px; bottom: 18%; left: 8%; animation-duration: 5s; animation-delay: 2s; }
        .glow-bubble:nth-child(4) { width: 12px; height: 12px; bottom: 12%; right: 10%; animation-duration: 6.5s; animation-delay: 0.5s; }
        .glow-bubble:nth-child(5) { width: 9px; height: 9px; top: 48%; left: 3%; animation-duration: 7.5s; animation-delay: 3s; }
        .glow-bubble:nth-child(6) { width: 11px; height: 11px; top: 44%; right: 4%; animation-duration: 6s; animation-delay: 1.5s; }
        .glow-bubble:nth-child(7) { width: 7px; height: 7px; top: 72%; left: 22%; animation-duration: 5.5s; animation-delay: 0.3s; }
        .glow-bubble:nth-child(8) { width: 13px; height: 13px; top: 68%; right: 20%; animation-duration: 7s; animation-delay: 2.5s; }

        /* ============ اللوحة ============ */
        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.85),
                inset 0 0 40px rgba(255, 60, 0, 0.3),
                0 0 30px rgba(255, 80, 0, 0.4);
            border: none;
            transition: filter 0.4s ease;
            display: block;
            position: relative;
            z-index: 3;
            background: #050302;
        }
        .wheel-wrapper canvas.spinning {
            filter: brightness(1.2) contrast(1.1)
                    drop-shadow(0 0 40px rgba(255, 80, 0, 0.6));
        }

        /* ============ السهم الناري ============ */
        .pointer {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 40px;
            filter: drop-shadow(0 0 15px rgba(255, 80, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 40, 0, 0.7));
            animation: pointerBounce 1.5s ease-in-out infinite;
            pointer-events: none;
            text-shadow: 0 0 20px #ff6600;
        }
        @keyframes pointerBounce {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
            50% { transform: translateX(-50%) translateY(-8px) scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: #ff8866;
            font-size: 15px;
            background: rgba(20, 5, 0, 0.9);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 80, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.2);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
        }

        /* ============ الأزرار ============ */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            letter-spacing: 0.5px;
        }
        .btn-spin {
            background: linear-gradient(135deg,
                #8b0000 0%,
                #ff2200 25%,
                #ff6600 50%,
                #ffaa00 75%,
                #ff6600 100%);
            background-size: 200% 200%;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255, 200, 100, 0.6);
            box-shadow:
                0 0 20px rgba(255, 80, 0, 0.6),
                0 0 40px rgba(255, 40, 0, 0.3),
                inset 0 0 20px rgba(255, 200, 100, 0.2),
                inset 0 -3px 10px rgba(0, 0, 0, 0.5);
            font-size: 19px;
            animation: fireBtnPulse 2s ease-in-out infinite;
            border: 1px solid rgba(255, 180, 0, 0.5);
        }
        @keyframes fireBtnPulse {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 0 20px rgba(255, 80, 0, 0.6),
                            0 0 40px rgba(255, 40, 0, 0.3),
                            inset 0 0 20px rgba(255, 200, 100, 0.2);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 0 30px rgba(255, 120, 0, 0.9),
                            0 0 60px rgba(255, 40, 0, 0.5),
                            inset 0 0 25px rgba(255, 200, 100, 0.3);
            }
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.15);
        }
        .btn-spin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            animation: none;
            filter: grayscale(0.6);
        }
        .btn-spin .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-spin.loading .spinner-small { display: inline-block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============ إشعار الإيداع ============ */
        .deposit-notice {
            background: rgba(20, 5, 0, 0.9);
            border: 1px solid rgba(255, 80, 0, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.2);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .deposit-notice.show { display: block; }
        .deposit-notice .notice-text { color: #ffaa44; font-size: 14px; }
        .deposit-notice .notice-text .amount {
            color: #ffdd44;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
        }
        .deposit-notice .notice-status { font-size: 13px; margin-top: 4px; color: #888; }
        .deposit-notice .notice-status .met {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 100, 0.6);
        }
        .deposit-notice .notice-status .not-met {
            color: #ff4444;
            text-shadow: 0 0 8px rgba(255, 60, 60, 0.6);
        }

        /* ============ صندوق النتيجة الناري ============ */
        .result-box {
            background: rgba(20, 5, 0, 0.92);
            border: 1px solid rgba(255, 80, 0, 0.3);
            border-radius: 18px;
            padding: 18px 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.3);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
        }
        .result-box.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultPop {
            0% { transform: scale(0.85) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-box.winner {
            border-color: rgba(255, 140, 0, 0.6);
            background: radial-gradient(circle at 50% 50%,
                rgba(255, 80, 0, 0.25) 0%,
                rgba(80, 10, 0, 0.9) 100%);
            animation: winFireGlow 1.2s ease-in-out infinite alternate;
        }
        @keyframes winFireGlow {
            0% {
                box-shadow: 0 0 30px rgba(255, 60, 0, 0.4),
                            inset 0 0 20px rgba(255, 100, 0, 0.2);
            }
            100% {
                box-shadow: 0 0 80px rgba(255, 120, 0, 0.9),
                            0 0 120px rgba(255, 40, 0, 0.5),
                            inset 0 0 40px rgba(255, 140, 0, 0.4);
            }
        }
        .result-box .confetti-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .result-box .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0;
            animation: confettiFall 2.2s ease-in forwards;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(220px) rotate(720deg) scale(0); }
        }

        .result-box .prize-icon { display: none; }
        .result-box .prize-name { display: none; }
        .result-box .prize-desc {
            color: #ffaa44;
            font-size: 24px;
            font-weight: 800;
            margin-top: 4px;
            padding: 6px 0;
            text-shadow: 0 0 15px rgba(255, 120, 0, 0.8);
        }
        .result-box.winner .prize-desc {
            background: linear-gradient(135deg,
                #ffdd00, #ff6600, #ff2200, #ff6600, #ffdd00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fireTextShine 1.5s ease-in-out infinite;
            font-size: 28px;
            filter: drop-shadow(0 0 15px rgba(255, 100, 0, 0.9));
        }
        @keyframes fireTextShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ============ رسائل الخطأ ============ */
        .error-msg {
            background: rgba(20, 5, 0, 0.92);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
            color: #ff6666;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .error-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* ============ شاشة اللودينغ ============ */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            background: radial-gradient(circle at 50% 100%,
                #3a0a00 0%, #0a0200 60%, #000 100%);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .loading-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .loading-screen .loading-image {
            width: 70vw;
            max-width: 280px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 100, 0, 0.4);
            box-shadow:
                0 0 50px rgba(255, 80, 0, 0.5),
                0 0 100px rgba(255, 40, 0, 0.3),
                inset 0 0 30px rgba(255, 100, 0, 0.3);
            animation: loadingPulse 2s ease-in-out infinite;
            margin-bottom: 28px;
        }
        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.9; }
        }
        .loading-screen .progress-container {
            width: 60%;
            max-width: 220px;
            position: relative;
        }
        .loading-screen .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .loading-screen .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,
                #ff2200, #ff6600, #ffcc00, #ff6600);
            background-size: 200% 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.9);
            animation: progressShine 1.5s linear infinite;
        }
        @keyframes progressShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .loading-screen .progress-text {
            color: #ffaa44;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.8);
        }

        /* ============ إعدادات الصوت ============ */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(20, 5, 0, 0.9);
            border-radius: 12px;
            border: 1px solid rgba(255, 80, 0, 0.2);
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 15px rgba(255, 60, 0, 0.15);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .sound-settings label {
            color: #ffaa66;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .sound-settings input[type="checkbox"] {
            accent-color: #ff6600;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .sound-settings .sound-indicator {
            color: #ff8800;
            font-size: 14px;
            filter: drop-shadow(0 0 6px rgba(255, 100, 0, 0.8));
        }

        /* ============ لوحة الإدارة ============ */
        .admin-panel {
            display: none;
            background: rgba(20, 5, 0, 0.92);
            border: 1px solid rgba(255, 80, 0, 0.25);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.2);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        .admin-panel .panel-title {
            color: #ff8800;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.8);
        }
        .admin-panel .panel-title .badge {
            background: linear-gradient(135deg, #ff2200, #ff8800);
            color: #fff;
            font-size: 9px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.6);
        }
        .admin-panel .prize-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 80, 0, 0.1);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-panel .prize-item .prize-icon-small {
            font-size: 22px;
            width: 34px;
            text-align: center;
            filter: drop-shadow(0 0 6px rgba(255, 100, 0, 0.6));
        }
        .admin-panel .prize-item .prize-info { flex: 1; min-width: 90px; }
        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255, 80, 0, 0.15);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            width: 100%;
            transition: border-color 0.3s;
        }
        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #ff6600;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4);
        }
        .admin-panel .prize-item .prize-info .desc-input {
            background: transparent;
            border: 1px solid rgba(255, 80, 0, 0.08);
            border-radius: 4px;
            color: #888;
            font-size: 10px;
            padding: 2px 6px;
            width: 100%;
            margin-top: 2px;
        }
        .admin-panel .prize-item .prize-info .desc-input:focus {
            outline: none;
            border-color: rgba(255, 100, 0, 0.5);
        }
        .admin-panel .prize-item .prize-prob {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .admin-panel .prize-item .prize-prob .prob-input {
            width: 44px;
            padding: 3px 4px;
            border-radius: 4px;
            border: 1px solid rgba(255, 80, 0, 0.25);
            background: rgba(0, 0, 0, 0.4);
            color: #ff8800;
            font-size: 11px;
            text-align: center;
        }
        .admin-panel .prize-item .prize-prob .prob-input:focus {
            outline: none;
            border-color: #ff6600;
            box-shadow: 0 0 8px rgba(255, 100, 0, 0.5);
        }
        .admin-panel .prize-item .prize-prob .prob-label { color: #777; font-size: 9px; }
        .admin-panel .prize-item .prize-prob .btn-save-prob {
            padding: 2px 8px;
            background: rgba(255, 100, 0, 0.15);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 4px;
            color: #ff8800;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .prize-item .prize-prob .btn-save-prob:hover {
            background: rgba(255, 100, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
        }
        .admin-panel .prize-item .prize-colors { display: flex; gap: 3px; }
        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 80, 0, 0.3);
            border-radius: 4px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .admin-panel .prize-item .prize-colors input[type="color"]:hover {
            border-color: #ff6600;
            box-shadow: 0 0 8px rgba(255, 100, 0, 0.5);
        }
        .admin-panel .prize-item .btn-delete {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff4444;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .admin-panel .prize-item .btn-delete:hover {
            background: rgba(255, 0, 0, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }
        .admin-panel .add-prize-form {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-panel .add-prize-form input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 80, 0, 0.25);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 11px;
            min-width: 50px;
        }
        .admin-panel .add-prize-form input:focus {
            outline: none;
            border-color: #ff6600;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4);
        }
        .admin-panel .add-prize-form input::placeholder { color: #666; }
        .admin-panel .add-prize-form .btn-add {
            padding: 6px 16px;
            background: linear-gradient(135deg, #8b0000, #ff4400);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            box-shadow: 0 0 10px rgba(255, 80, 0, 0.5);
        }
        .admin-panel .add-prize-form .btn-add:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 120, 0, 0.8);
        }
        .admin-panel .add-prize-form .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .admin-panel .panel-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-actions .btn-action {
            padding: 5px 14px;
            border: 1px solid rgba(255, 80, 0, 0.25);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #ff8800;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .panel-actions .btn-action:hover {
            background: rgba(255, 100, 0, 0.1);
            border-color: #ff6600;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4);
        }
        .admin-panel .panel-actions .btn-action.danger {
            color: #ff4444;
            border-color: rgba(255, 0, 0, 0.25);
        }
        .admin-panel .panel-actions .btn-action.danger:hover {
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff4444;
        }
        .admin-panel .settings-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 80, 0, 0.15);
        }
        .admin-panel .settings-section .setting-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .settings-section .setting-row label {
            color: #aa8866;
            font-size: 11px;
            min-width: 70px;
        }
        .admin-panel .settings-section .setting-row input,
        .admin-panel .settings-section .setting-row textarea {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 80, 0, 0.25);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 11px;
            min-width: 60px;
        }
        .admin-panel .settings-section .setting-row input:focus,
        .admin-panel .settings-section .setting-row textarea:focus {
            outline: none;
            border-color: #ff6600;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4);
        }
        .admin-panel .settings-section .setting-row .btn-save {
            padding: 4px 14px;
            background: rgba(255, 100, 0, 0.15);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 4px;
            color: #ff8800;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .admin-panel .settings-section .setting-row .btn-save:hover {
            background: rgba(255, 100, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
        }
        .admin-panel .settings-section .setting-row .btn-save.saved {
            background: rgba(0, 255, 100, 0.15);
            border-color: rgba(0, 255, 100, 0.3);
            color: #00ff88;
        }
        .admin-panel .settings-section .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .admin-panel .settings-section .toggle-row label {
            color: #aa8866;
            font-size: 11px;
            min-width: 70px;
        }
        .admin-panel .settings-section .toggle-row input[type="checkbox"] {
            accent-color: #ff6600;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .admin-panel .settings-section .toggle-row .btn-save {
            padding: 4px 14px;
            background: rgba(255, 100, 0, 0.15);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 4px;
            color: #ff8800;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .settings-section .toggle-row .btn-save:hover {
            background: rgba(255, 100, 0, 0.3);
        }
        .admin-panel .settings-section .toggle-row .btn-save.saved {
            background: rgba(0, 255, 100, 0.15);
            border-color: rgba(0, 255, 100, 0.3);
            color: #00ff88;
        }

        /* ============ حاوية الخطأ ============ */
        .error-container {
            display: none;
            text-align: center;
            padding: 30px 16px;
            background: rgba(20, 5, 0, 0.92);
            border: 1px solid rgba(255, 80, 0, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 40px rgba(255, 60, 0, 0.3);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }
        .error-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        .error-container .error-icon {
            font-size: 44px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 100, 0, 0.8));
        }
        .error-container .error-title {
            color: #ff8800;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(255, 100, 0, 0.8);
        }
        .error-container .error-text {
            color: #aa8866;
            font-size: 14px;
            line-height: 1.6;
        }
        .error-container .error-text .highlight {
            color: #ffaa44;
            font-weight: 700;
        }
        .error-container .btn-open-bot {
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #8b0000, #ff4400);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 80, 0, 0.6);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .error-container .btn-open-bot:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 120, 0, 0.9);
        }

        /* ============ شريط الإشعار ============ */
        .notification-bar {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #8b0000, #ff2200, #ff6600);
            background-size: 200% 200%;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(255, 80, 0, 0.7),
                        0 0 60px rgba(255, 40, 0, 0.4);
            animation: notifSlideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 180, 0, 0.5);
        }
        .notification-bar.show {
            display: block;
            animation: notifSlideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                       fireBtnPulse 1.5s ease-in-out infinite;
        }
        @keyframes notifSlideDown {
            0% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* ============ استجابة الجوال ============ */
        @media (max-width: 480px) {
            .btn { font-size: 16px; padding: 14px 16px; }
            .btn-spin { font-size: 17px; }
            .pointer { font-size: 32px; top: -18px; }
            .result-box .prize-desc { font-size: 20px; }
            .result-box.winner .prize-desc { font-size: 24px; }
            .admin-panel .prize-item { flex-direction: column; align-items: stretch; }
            .admin-panel .prize-item .prize-colors { justify-content: center; }
            .admin-panel .settings-section .setting-row { flex-direction: column; align-items: stretch; }
            .admin-panel .settings-section .setting-row label { min-width: auto; }
            .loading-screen .loading-image { width: 60vw; max-width: 220px; }
            .admin-panel .add-prize-form input { min-width: 40px; font-size: 10px; }
            .admin-panel .prize-item .prize-info { min-width: 70px; }
            .admin-panel .prize-item .prize-prob .prob-input { width: 38px; }
            .sound-settings { gap: 12px; padding: 4px 12px; }
            .wheel-wrapper { padding: 22px; }
            .swords-container { width: 130%; height: 130%; }
        }

        @media (max-width: 380px) {
            .btn-spin { font-size: 15px; padding: 12px 14px; }
            .result-box .prize-desc { font-size: 17px; }
            .result-box.winner .prize-desc { font-size: 20px; }
            .pointer { font-size: 28px; top: -16px; }
            .wheel-wrapper { padding: 18px; }
        }
    </style>
</head>
<body>

    <!-- خلفية -->
    <div class="bg-image-fixed">
        <img id="bgImage" src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=1920&q=80" alt="Background">
    </div>

    <!-- طبقة اللهب الملحمية -->
    <div class="fire-overlay"></div>

    <!-- جزيئات الشرر المتطايرة -->
    <div class="embers-layer" id="embersLayer"></div>

    <div class="notification-bar" id="notificationBar">
        🔥 مبروك! لقد فزت بـ <span id="notifPrizeName">جائزة</span>!
    </div>

    <div class="user-status" id="userStatus"></div>

    <div class="error-container" id="errorContainer">
        <div class="error-icon">🔥</div>
        <div class="error-title">يجب الدخول من البوت</div>
        <div class="error-text">
            لا يمكن الوصول إلى معرف المستخدم.<br>
            يرجى فتح العجلة من خلال <span class="highlight">بوت IChancy</span>.
        </div>
        <button class="btn-open-bot" onclick="window.open('https://t.me/IChancyBot', '_blank')">🔥 فتح البوت</button>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <img class="loading-image" id="loadingImage" src="https://via.placeholder.com/200/1a1a2e/FFD700?text=🎡" alt="Loading">
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="loaderProgressBar"></div>
            </div>
            <div class="progress-text" id="loaderStatusText">0%</div>
        </div>
    </div>

    <!-- ===== العجلة الملحمية ===== -->
    <div class="wheel-wrapper" id="wheelWrapper">
        <div class="wheel-container">
            <!-- هالة نارية -->
            <div class="fire-halo"></div>

            <!-- الإطار الناري الخارجي -->
            <div class="fire-frame"></div>

            <!-- السيوف المتقاطعة -->
            <div class="swords-container">
                <div class="sword sword-left">
                    <div class="sword-blade"></div>
                    <div class="sword-guard"></div>
                    <div class="sword-handle"></div>
                    <div class="sword-pommel"></div>
                </div>
                <div class="sword sword-right">
                    <div class="sword-blade"></div>
                    <div class="sword-guard"></div>
                    <div class="sword-handle"></div>
                    <div class="sword-pommel"></div>
                </div>
            </div>

            <!-- الإطار الناري الداخلي -->
            <div class="fire-ring"></div>

            <!-- الشرر الناري -->
            <div class="glow-bubbles-container">
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
                <div class="glow-bubble"></div>
            </div>

            <!-- السهم -->
            <div class="pointer" id="pointer">🔻</div>

            <!-- اللوحة -->
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <div class="no-prizes" id="noPrizes">
        <div style="font-size:28px;">⚠️</div>
        <div style="margin-top:6px;">لا توجد جوائز متاحة</div>
    </div>

    <div class="actions">
        <button class="btn btn-spin" id="spinBtn" disabled>
            <span class="spinner-small"></span>
            <span id="spinBtnText">🔥 دوّر العجلة النارية</span>
        </button>
    </div>

    <div class="deposit-notice" id="depositNotice">
        <div class="notice-text">
            💰 مطلوب إيداع <span class="amount" id="depositMinAmount">0</span> SYP
            خلال <span id="depositCheckHours">24</span> ساعة
        </div>
        <div class="notice-status" id="depositStatus">
            الحالة: <span class="not-met">❌ غير مكتمل</span>
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="confetti-container" id="confettiContainer"></div>
        <div class="prize-icon" id="prizeIcon">🎁</div>
        <div class="prize-name" id="prizeName">جائزة!</div>
        <div class="prize-desc" id="prizeDesc"></div>
    </div>

    <div class="sound-settings">
        <label>
            <span class="sound-indicator">🔊</span>
            <input type="checkbox" id="soundToggle" checked> مؤثرات
        </label>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="panel-title">
            🔥 لوحة الإدارة
            <span class="badge">ADMIN</span>
        </div>
        <div id="prizesList"></div>

        <div class="add-prize-form">
            <input type="text" id="newPrizeName" placeholder="الاسم (للإدارة)">
            <input type="text" id="newPrizeIcon" placeholder="🎁" style="max-width:44px;">
            <input type="text" id="newPrizeDesc" placeholder="الوصف (يظهر للجمهور)" style="flex:1.5;">
            <input type="number" id="newPrizeProb" placeholder="نسبة" style="max-width:55px;">
            <input type="color" id="newPrizeColor" value="#1a1a2e" style="max-width:34px;padding:2px;">
            <input type="color" id="newPrizeColor2" value="#16213e" style="max-width:34px;padding:2px;">

        // ================================================================

        // ================================================================
        class ConnectionManager {
            constructor() {
                this.maxRetries = 3;
                this.retryDelay = 2000;
                this.timeout = 50000;
            }

            async fetchWithRetry(url, options = {}, retryCount = 0) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), this.timeout);

                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') {
                        throw new Error('انتهت مهلة الاتصال بالخادم (50 ثانية)');
                    }
                    if (retryCount < this.maxRetries) {
                        const delay = this.retryDelay * (retryCount + 1);
                        console.log(`محاولة إعادة الاتصال ${retryCount + 1}/${this.maxRetries} بعد ${delay}ms`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return this.fetchWithRetry(url, options, retryCount + 1);
                    }
                    throw error;
                }
            }
        }

        // ================================================================
        //                      نظام الصوت
        // ================================================================
        class AdvancedSoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
                this.isPlaying = false;
                this.spinSoundInterval = null;
            }
            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) { console.warn('Web Audio not supported'); }
            }
            stopAll() {
                this.stopSpinSound();
                if (this.audioContext) {
                    try {
                        this.audioContext.close();
                        this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {}
                }
                this.isPlaying = false;
            }
            playSpinSound() {
                if (!soundEnabled || !this.initialized) return;
                this.stopSpinSound();
                try {
                    const ctx = this.audioContext;
                    let count = 0;
                    this.spinSoundInterval = setInterval(() => {
                        if (!soundEnabled || !this.initialized) { this.stopSpinSound(); return; }
                        try {
                            const t = ctx.currentTime;
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            const freq = 180 + Math.sin(count * 0.7) * 25 + Math.sin(count * 0.3) * 15;
                            osc.frequency.setValueAtTime(freq, t);
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.025, t);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
                            osc.start(t);
                            osc.stop(t + 0.07);
                            count++;
                        } catch (e) {}
                    }, 110);
                    setTimeout(() => this.stopSpinSound(), 6000);
                } catch (e) {}
            }
            stopSpinSound() {
                if (this.spinSoundInterval) {
                    clearInterval(this.spinSoundInterval);
                    this.spinSoundInterval = null;
                }
            }
            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const notes = [
                        [523, 0.2, 0.06],[587, 0.2, 0.06],[659, 0.2, 0.06],[784, 0.3, 0.07],
                        [659, 0.2, 0.06],[784, 0.2, 0.06],[880, 0.2, 0.06],[988, 0.35, 0.08],
                        [880, 0.2, 0.06],[784, 0.2, 0.06],[880, 0.2, 0.06],[1175, 0.4, 0.09]
                    ];
                    notes.forEach(([freq, dur, vol], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.08);
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        gain.gain.setValueAtTime(vol || 0.05, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + dur);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + dur);
                    });
                    setTimeout(() => {
                        const t = ctx.currentTime;
                        [523, 587, 659, 784].forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(freq, t + i * 0.07);
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.025, t + i * 0.07);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.25);
                            osc.start(t + i * 0.07);
                            osc.stop(t + i * 0.07 + 0.25);
                        });
                    }, notes.length * 0.08 + 0.1);
                    setTimeout(() => { this.isPlaying = false; }, 3000);
                } catch (e) { this.isPlaying = false; }
            }
            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const notes = [[440, 0.35, 0.04],[370, 0.35, 0.04],[330, 0.45, 0.05],[247, 0.6, 0.05]];
                    notes.forEach(([freq, dur, vol], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.25);
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(vol || 0.04, now + i * 0.25);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + dur);
                        osc.start(now + i * 0.25);
                        osc.stop(now + i * 0.25 + dur);
                    });
                    setTimeout(() => {
                        const t = ctx.currentTime;
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(200, t);
                        osc2.frequency.exponentialRampToValueAtTime(100, t + 0.7);
                        osc2.type = 'sawtooth';
                        gain2.gain.setValueAtTime(0.02, t);
                        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
                        osc2.start(t);
                        osc2.stop(t + 0.7);
                    }, notes.length * 0.25 + 0.1);
                    setTimeout(() => { this.isPlaying = false; }, 2000);
                } catch (e) { this.isPlaying = false; }
            }
            playStartSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    [440, 554, 659].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.1);
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.02, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.12);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.12);
                    });
                } catch (e) {}
            }
        }

        // ================================================================
        //                      رسم العجلة (بنفس المنطق)
        // ================================================================
        function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const r = Math.min(w, h) / 2 - 12;
            const noPrizes = document.getElementById('noPrizes');
            const wrapper = document.getElementById('wheelWrapper');

            if (!prizes || prizes.length === 0) {
                noPrizes.style.display = 'block';
                wrapper.classList.remove('show');
                return;
            }
            noPrizes.style.display = 'none';
            wrapper.classList.add('show');
            ctx.clearRect(0, 0, w, h);

            const total = prizes.length;
            const step = (2 * Math.PI) / total;

            prizes.forEach((p, i) => {
                const start = i * step + rotation - Math.PI / 2;
                const end = start + step;
                const isHighlight = (i === highlightIndex);

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                const color1 = p.color || '#1a1a2e';
                const color2 = p.color2 || '#16213e';
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);

                if (isHighlight) {
                    grad.addColorStop(0, '#FFD700');
                    grad.addColorStop(0.5, '#FF8C00');
                    grad.addColorStop(1, '#B8860B');
                } else {
                    grad.addColorStop(0, color1);
                    grad.addColorStop(1, color2);
                }
                ctx.fillStyle = grad;
                ctx.fill();

                if (isHighlight) {
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 50;
                } else {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                }

                ctx.strokeStyle = isHighlight ? '#FFD700' : 'rgba(255,215,0,0.05)';
                ctx.lineWidth = isHighlight ? 2.5 : 0.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                const mid = start + step / 2;
                const tr = r * 0.62;
                const x = cx + Math.cos(mid) * tr;
                const y = cy + Math.sin(mid) * tr;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(mid + (mid > Math.PI / 2 ? Math.PI : 0));
                ctx.fillStyle = isHighlight ? '#0a0a0a' : '#fff';
                ctx.font = isHighlight ? 'bold 19px sans-serif' : '17px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText(p.icon || '🎁', 0, 0);
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            const centerR = r * 0.16;
            const centerIcon = settingsCache.center_icon || '⭐';

            const grad = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, centerR);
            grad.addColorStop(0, '#FFD700');
            grad.addColorStop(0.3, '#FFA500');
            grad.addColorStop(0.7, '#FF8C00');
            grad.addColorStop(1, '#B8860B');

            ctx.beginPath();
            ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(cx, cy, centerR + 5, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0a0a0a';
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText(centerIcon, cx, cy + 1);
            ctx.shadowBlur = 0;
        }

        // ================================================================
        //                      دوران العجلة
        // ================================================================
        function animateSpin(targetRotation, duration, callback) {
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');
            const startRotation = currentRotation;
            const startTime = performance.now();
            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const easedProgress = easeOutCubic;
                const currentAngle = startRotation + (targetRotation - startRotation) * easedProgress;
                currentRotation = currentAngle;
                drawWheel(prizesCache, -1, currentAngle);
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    canvas.classList.remove('spinning');
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animate);
        }
